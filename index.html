<!DOCTYPE html>

<head>

<!-- Adianta a conexão com o servidor das bibliotecas externas, economizando tempo no
     primeiro carregamento (especialmente no celular). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<script>
  // Detecta cedo se a página está incorporada (embed) dentro de outra página, como
  // um Google Site — nesse caso a altura do iframe é definida por fora e pode não
  // bater com a tela do celular, o que empurrava o campo "Escreva aqui..." para o
  // meio da tela. Rodando isto ANTES do CSS pintar a página, evitamos qualquer
  // "pulo" visual: html.is-embedded já nasce com a classe certa.
  try {
    if (window.self !== window.top) {
      document.documentElement.classList.add("is-embedded");
    }
  } catch (e) {
    // Acesso entre origens bloqueado pelo navegador só acontece quando já estamos
    // dentro de um iframe de outra origem — ou seja, isso também é sinal de embed.
    document.documentElement.classList.add("is-embedded");
  }
</script>

<style>
  :root {
    --bg: #f6f1e7;
    --bg-panel: #fffdf8;
    --ink: #2b2420;
    --ink-soft: #6b5f52;
    --accent: #7a3b2e;
    --accent-dark: #5c2c22;
    --user-bubble: #eadfc9;
    --bot-bubble: #ffffff;
    --border: #e2d6bd;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Georgia", "Iowan Old Style", serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    max-width: 760px;
    padding: 16px 20px 10px;
    text-align: center;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
  }
  #header-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #header-logo {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }
  header h1 {
    margin: 0;
    font-size: 1.4rem;
    color: var(--accent-dark);
    letter-spacing: 0.02em;
  }
  header p {
    margin: 6px 0 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }
  header p.hidden {
    display: none;
  }
  #input-label {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 6px 20px 4px;
    color: var(--ink);
    font-weight: 600;
    font-size: 1.15rem;
    text-align: center;
    line-height: 1.4;
  }
  #input-label span {
    color: var(--accent);
    font-weight: bold;
  }
  #input-label.hidden {
    display: none;
  }
  /* O rodapé "© Autoconfrontação Bíblica · 2026" foi retirado da TELA para não
     ocupar altura à toa no celular. Ele continua aparecendo no relatório em PDF
     e no texto enviado por WhatsApp, onde a assinatura faz sentido. */
  .welcome-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    margin: auto;
    padding: 20px 10px;
  }
  .logo-frame {
    position: relative;
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-frame::before {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(247, 200, 119, 0.65) 0%, rgba(247, 200, 119, 0.28) 45%, transparent 72%);
    animation: logo-glow 3s ease-in-out infinite;
    z-index: 0;
  }
  .welcome-hero img {
    position: relative;
    z-index: 1;
    width: 84px;
    height: 84px;
    border-radius: 50%;
  }
  @keyframes logo-glow {
    0%, 100% { transform: scale(0.8); opacity: 0.6; }
    50% { transform: scale(2); opacity: 1; }
  }
  .welcome-hero h2 {
    margin: 0;
    font-size: 1.3rem;
    color: var(--accent-dark);
    letter-spacing: 0.02em;
  }
  .verse-card {
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 22px;
    max-width: 480px;
  }
  .verse-card p {
    margin: 0;
    font-style: italic;
    color: var(--ink);
    line-height: 1.6;
    font-size: 0.98rem;
  }
  .verse-card span {
    display: block;
    margin-top: 10px;
    font-style: normal;
    font-weight: bold;
    color: var(--accent-dark);
    font-size: 0.86rem;
  }
  .welcome-note {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.85rem;
    margin: 0;
  }
  #chat-container {
    width: 100%;
    max-width: 760px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin: 10px 16px 16px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(90, 60, 30, 0.08);
  }
  #toolbar {
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    background: #fbf6ea;
    /* nowrap: os três botões ficam SEMPRE na mesma linha, nunca empilhados */
    flex-wrap: nowrap;
    flex-shrink: 0;
    justify-content: center;
    align-items: center;
  }
  .toolbar-btn {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 1 auto;
    min-width: 0;
  }
  .toolbar-btn:hover:not(:disabled) { background: var(--user-bubble); }
  .toolbar-btn:disabled { opacity: 0.4; cursor: default; }

  /* Ao final da conversa, os botões de WhatsApp e PDF pulsam em dourado para
     convidar a pessoa a levar o relatório consigo. */
  .toolbar-btn.destaque:not(:disabled) {
    border-color: #d9a441;
    background: #fffaf0;
    font-weight: 600;
    animation: botao-pulsa 1.8s ease-in-out infinite;
  }
  @keyframes botao-pulsa {
    0%, 100% { box-shadow: 0 0 6px 0 rgba(240, 180, 90, 0.45); transform: scale(1); }
    50% { box-shadow: 0 0 18px 4px rgba(240, 180, 90, 0.9); transform: scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    .toolbar-btn.destaque:not(:disabled) { animation: none; box-shadow: 0 0 12px 2px rgba(240, 180, 90, 0.8); }
  }
  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 84%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 0.98rem;
  }
  .msg.user {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.assistant p { margin: 0 0 10px; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 {
    color: var(--accent-dark);
    margin: 14px 0 8px;
    font-size: 1.05rem;
  }
  .msg.assistant h1:first-child, .msg.assistant h2:first-child, .msg.assistant h3:first-child { margin-top: 0; }
  .msg.assistant strong { color: var(--accent-dark); }
  .msg.assistant em { color: var(--ink); }
  .msg.assistant ul, .msg.assistant ol { margin: 6px 0; padding-left: 22px; }
  .msg.assistant li { margin-bottom: 4px; }
  .msg.assistant hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .msg.assistant blockquote {
    margin: 10px 0;
    padding: 8px 14px;
    border-left: 3px solid var(--accent);
    background: var(--user-bubble);
    border-radius: 0 8px 8px 0;
    font-style: italic;
    color: var(--accent-dark);
  }
  .msg.assistant blockquote p { margin: 0; }
  .msg.assistant blockquote + blockquote { margin-top: -4px; }
  /* Cursor piscando enquanto a resposta está sendo escrita ao vivo, para deixar
     claro que o texto ainda está chegando e não acabou. */
  .msg.assistant.streaming::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: 1em;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: var(--accent);
    animation: caret-blink 1s steps(1) infinite;
  }
  @keyframes caret-blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .msg.error {
    align-self: center;
    background: #fbeaea;
    border: 1px solid #e6b8b8;
    color: #7a2e2e;
    font-size: 0.9rem;
    text-align: center;
  }
  .msg.system-note {
    align-self: center;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.85rem;
    background: none;
    padding: 4px;
    text-align: center;
  }
  .user-turn {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    align-self: flex-end;
    max-width: 84%;
    gap: 3px;
  }
  .user-turn .msg.user { max-width: 100%; }
  .edit-link {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 0.72rem;
    font-family: inherit;
    cursor: pointer;
    padding: 0 4px;
    opacity: 0.65;
  }
  .edit-link:hover { opacity: 1; text-decoration: underline; }
  .options-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-self: flex-start;
    max-width: 84%;
    margin-top: -6px;
  }
  .option-btn {
    background: var(--bg-panel);
    border: 1.5px solid var(--accent);
    color: var(--accent-dark);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
  }
  .option-btn:hover:not(:disabled) { background: var(--user-bubble); }
  .option-btn:disabled { opacity: 0.4; cursor: default; }
  #input-row {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
    flex-shrink: 0;
  }
  @property --glow-angle {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }
  .input-glow-wrap {
    position: relative;
    flex: 1;
    border-radius: 12px;
    padding: 3px;
    background: conic-gradient(
      from var(--glow-angle),
      var(--accent) 0deg,
      var(--accent) 200deg,
      #f7c877 250deg,
      #fff2cf 290deg,
      #ffffff 300deg,
      #fff2cf 310deg,
      #f7c877 350deg,
      var(--accent) 360deg
    );
    animation: glow-spin 3s linear infinite, glow-pulse 2s ease-in-out infinite;
  }
  @keyframes glow-spin {
    to { --glow-angle: 360deg; }
  }
  @keyframes glow-pulse {
    0%, 100% { box-shadow: 0 0 10px 1px rgba(240, 180, 90, 0.4); }
    50% { box-shadow: 0 0 26px 6px rgba(240, 180, 90, 0.85); }
  }
  #input-row textarea {
    display: block;
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    border-radius: 9px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.98rem;
    min-height: 44px;
    max-height: 140px;
    background: #fffefb;
    color: var(--ink);
  }
  #input-row textarea:focus {
    outline: 2px solid var(--accent);
  }
  #input-row textarea:disabled {
    background: #f1ede4;
    color: var(--ink-soft);
  }
  #send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-dark); }
  #send-btn:disabled { opacity: 0.5; cursor: default; }
  .typing {
    align-self: flex-start;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.9rem;
    padding: 4px 4px;
  }

  @media (max-width: 480px) {
    header { padding: 12px 14px 8px; }
    header h1 { font-size: 1.2rem; }
    #header-logo { width: 26px; height: 26px; }
    header p { font-size: 0.82rem; }
    .welcome-hero img { width: 64px; height: 64px; }
    .logo-frame { width: 64px; height: 64px; }
    .logo-frame::before { inset: -14px; }
    .welcome-hero h2 { font-size: 1.1rem; }
    .verse-card { padding: 12px 16px; }
    .verse-card p { font-size: 0.9rem; }
    #input-label { font-size: 1rem; padding: 0 14px; }
    /* Centralizado na horizontal e aproveitando quase toda a largura da tela. */
    #chat-container {
      margin: 6px auto 8px;
      width: calc(100% - 12px);
      border-radius: 10px;
    }
    #messages { padding: 12px 10px; gap: 10px; }
    /* As respostas passam a ocupar a largura toda: no celular, sobra de margem
       lateral só espreme o texto e força mais rolagem. */
    .msg { max-width: 100%; font-size: 0.94rem; padding: 11px 13px; }
    .msg.assistant { width: 100%; }
    .user-turn { max-width: 88%; }
    .options-row { max-width: 100%; }
    .option-btn { padding: 9px 14px; }
    #toolbar { padding: 7px 6px; gap: 6px; }
    .toolbar-btn { font-size: 0.78rem; padding: 7px 9px; }
    #input-row { padding: 9px; gap: 8px; }
    #send-btn { padding: 0 16px; }
  }

  /* Telas bem estreitas (iPhone SE e afins): encolhe só o texto dos botões, para
     que os três continuem na mesma linha sem quebrar. */
  @media (max-width: 360px) {
    .toolbar-btn { font-size: 0.72rem; padding: 7px 7px; }
    #toolbar { gap: 4px; }
  }

  /* MODO INCORPORADO (embed em Google Sites ou outra página via iframe):
     não dá para confiar que a altura do iframe bate com a tela do celular, então
     abandonamos o layout "tela cheia fixa" (que empurrava o campo de digitação
     para o meio da tela) e deixamos a página fluir normalmente, com o campo de
     digitação grudado (sticky) na parte de baixo da área visível, onde quer que
     a pessoa role a página. */
  html.is-embedded, html.is-embedded body {
    height: auto;
  }
  html.is-embedded body {
    display: block;
  }
  html.is-embedded header {
    position: static;
  }
  html.is-embedded #chat-container {
    flex: none;
    height: auto;
    min-height: 420px;
    /* #chat-container tinha "overflow: hidden" (para arredondar cantos no modo
       tela cheia). Isso, sem querer, cria um contêiner de rolagem próprio e
       impedia o "position: sticky" do campo de digitação de funcionar aqui —
       por isso liberamos o overflow apenas no modo incorporado. */
    overflow: visible;
    border-radius: 14px 14px 0 0;
  }
  html.is-embedded #messages {
    flex: none;
    overflow-y: visible;
    min-height: 200px;
  }
  html.is-embedded #input-row {
    position: sticky;
    bottom: 0;
    z-index: 6;
    box-shadow: 0 -2px 10px rgba(90, 60, 30, 0.06);
  }
</style>
</head>
<body>

<header>
  <div id="header-title-row">
    <img id="header-logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj4KICA8Y2lyY2xlIGN4PSIxMDAiIGN5PSIxMDAiIHI9Ijk2IiBmaWxsPSIjN2EzYjJlIi8+CiAgPHBhdGggZD0iTTEwMCA0MCBMMTAwIDE2MCBNNjAgODIgTDE0MCA4MiIgc3Ryb2tlPSIjZjZmMWU3IiBzdHJva2Utd2lkdGg9IjE4IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz4KPC9zdmc+Cg==" alt="Logotipo Aconselhamento Bíblico Cristocêntrico" />
    <h1>Aconselhamento Bíblico Cristocêntrico</h1>
  </div>
</header>

<div id="chat-container">
  <div id="messages"></div>
  <p id="input-label">Escreva sua situação e você será ajudado(a) por meio do aconselhamento bíblico cristocêntrico <span aria-hidden="true">↓</span></p>
  <div id="input-row">
    <div class="input-glow-wrap">
      <textarea id="user-input" placeholder="Escreva aqui o que você está enfrentando…" rows="2"></textarea>
    </div>
    <button id="send-btn">Enviar</button>
  </div>
  <div id="toolbar">
    <button id="restart-btn" class="toolbar-btn" title="Apagar tudo e começar uma nova conversa">🔄 Reiniciar</button>
    <button id="whatsapp-btn" class="toolbar-btn" title="Enviar esta conversa pelo WhatsApp" disabled>🟢 WhatsApp</button>
    <button id="pdf-btn" class="toolbar-btn" title="Salvar esta conversa como PDF" disabled>🖨️ PDF</button>
  </div>
</div>


<script>
  // ====== CONFIGURAÇÃO ======
  const WORKER_URL = "https://aconselhamento-biblico.lana-lopes-psicopedagoga.workers.dev";
  const APP_SECRET = "biblico2026";
  const CLOSING_MARKER = "[CONVERSA_CONCLUIDA]";
  const CRISIS_ALERT_TEXT = "Se você estiver passando por uma crise ou sofrimento intenso, não enfrente isso sozinho(a): compartilhe sua dor com pessoas próximas, um pastor ou uma igreja genuinamente cristã, e busque também canais oficiais de apoio — CVV 188 (ligação gratuita, 24h) ou suporte médico/terapêutico profissional.";
  const FOOTER_TEXT = "© Autoconfrontação Bíblica · 2026";
  // Mensagem sempre amigável para qualquer falha do servidor — nunca mostramos o
  // texto técnico original do erro (ex.: mensagens em inglês do Gemini) para quem
  // está usando o site; a pessoa só precisa saber que pode tentar de novo.
  const FRIENDLY_ERROR_TEXT = "Não deu para concluir agora. Isso costuma ser passageiro — toque em \"Tentar novamente\" em alguns segundos.";
  const FRIENDLY_NETWORK_ERROR_TEXT = "Não foi possível conectar agora. Verifique sua internet e toque em \"Tentar novamente\".";
  // Frases que se alternam durante a espera, para a pessoa sentir que algo está
  // de fato acontecendo (em vez de uma única palavra estática por até 10-15s).
  const LOADING_PHRASES = ["Refletindo…", "Buscando as Escrituras…", "Preparando uma resposta cuidadosa…"];
  // Tempo máximo esperando o PRIMEIRO pedaço de texto aparecer. Como agora o texto
  // chega ao vivo, esse primeiro pedaço costuma vir em 1 a 2 segundos; se passar
  // disso, algo está errado e partimos para o plano B em vez de deixar a pessoa parada.
  const FIRST_CHUNK_TIMEOUT_MS = 20000;
  // Depois que o texto começou a chegar, quanto tempo aceitamos a conexão ficar
  // PARADA antes de considerar que travou. Generoso o bastante para o relatório
  // final (que é longo e tem pausas naturais), curto o bastante para nunca deixar
  // a pessoa presa olhando um cursor que não anda.
  const STALL_TIMEOUT_MS = 25000;
  // ============================

  const messagesEl = document.getElementById("messages");
  const inputRowEl = document.getElementById("input-row");
  const inputEl = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  const inputLabelEl = document.getElementById("input-label");
  const restartBtn = document.getElementById("restart-btn");
  const whatsappBtn = document.getElementById("whatsapp-btn");
  const pdfBtn = document.getElementById("pdf-btn");

  // A conversa vive só na memória desta aba. Recarregar a página, ou clicar em
  // "Reiniciar", apaga tudo — de propósito, sem guardar nada entre visitas.
  let history = [];

  // Trava contra cliques repetidos: enquanto uma resposta está sendo buscada ou
  // escrita, novos envios são ignorados (antes, dois toques rápidos no botão
  // disparavam duas conversas ao mesmo tempo e bagunçavam o histórico).
  let isProcessing = false;
  // Permite cancelar de verdade a resposta em andamento ao clicar em "Reiniciar".
  let activeAbortController = null;

  // A caixa de texto cresce sozinha conforme a pessoa escreve, até um limite.
  function resetInputSize() {
    inputEl.style.height = "44px";
    inputEl.style.overflowY = "hidden";
  }
  inputEl.addEventListener("input", function () {
    this.style.height = "44px";
    const alturaReal = this.scrollHeight;
    if (alturaReal > 44) this.style.height = Math.min(alturaReal, 140) + "px";
    this.style.overflowY = alturaReal >= 140 ? "auto" : "hidden";
  });

  const LOGO_DATA_URI ="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj4KICA8Y2lyY2xlIGN4PSIxMDAiIGN5PSIxMDAiIHI9Ijk2IiBmaWxsPSIjN2EzYjJlIi8+CiAgPHBhdGggZD0iTTEwMCA0MCBMMTAwIDE2MCBNNjAgODIgTDE0MCA4MiIgc3Ryb2tlPSIjZjZmMWU3IiBzdHJva2Utd2lkdGg9IjE4IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz4KPC9zdmc+Cg==";

  function renderWelcome() {
    messagesEl.innerHTML = "";
    const hero = document.createElement("div");
    hero.className = "welcome-hero";
    hero.innerHTML =
      '<div class="logo-frame"><img src="' + LOGO_DATA_URI + '" alt="Logotipo Aconselhamento Bíblico Cristocêntrico" /></div>' +
      "<h2>Aconselhamento Bíblico Cristocêntrico</h2>" +

    messagesEl.appendChild(hero);
    inputLabelEl.classList.remove("hidden");

  function clearWelcomeNote() {
    const hero = messagesEl.querySelector(".welcome-hero");
    if (hero) hero.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Ao chegar uma nova resposta do conselheiro, a tela deve rolar até o INÍCIO
  // dessa resposta (não até o fim) — assim a pessoa entende que precisa começar a
  // ler o texto a partir dali, e desce por conta própria até achar as perguntas
  // de múltipla escolha no final. scrollIntoView cuida de rolar o contêiner certo
  // tanto no site sozinho quanto quando ele está incorporado (embed) em outra página.
  function scrollToStartOf(el) {
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // A caixa de digitação livre só aparece na primeira mensagem (para descrever a
  // situação) e enquanto não houver botões de opção para responder. Depois disso,
  // some, e a pessoa responde só pelos botões — a não ser que esteja editando uma
  // resposta anterior, quando ela volta a aparecer.
  function setInputRowVisible(visible) {
    inputRowEl.style.display = visible ? "flex" : "none";
  }

  function truncateFromInclusive(node) {
    let el = node;
    while (el) {
      const next = el.nextSibling;
      el.remove();
      el = next;
    }
  }

  function appendUserBubble(text, historyIndexBefore) {
    clearWelcomeNote();
    inputLabelEl.classList.add("hidden");

    const wrapper = document.createElement("div");
    wrapper.className = "user-turn";

    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = text;
    wrapper.appendChild(div);

    const editLink = document.createElement("button");
    editLink.className = "edit-link";
    editLink.type = "button";
    editLink.textContent = "✏️ voltar e mudar esta resposta";
    editLink.addEventListener("click", () => {
      if (isProcessing) return; // não deixa editar enquanto uma resposta está chegando
      truncateFromInclusive(wrapper);
      history = history.slice(0, historyIndexBefore);

      const lastChild = messagesEl.lastElementChild;
      if (lastChild && lastChild.classList.contains("options-row")) {
        Array.from(lastChild.querySelectorAll("button")).forEach((b) => (b.disabled = false));
      }

      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.value = text;
      setInputRowVisible(true);
      inputEl.focus();
      updateExportButtonsState();
      if (!messagesEl.children.length) renderWelcome();
    });
    wrapper.appendChild(editLink);

    messagesEl.appendChild(wrapper);
    scrollToBottom();
    return wrapper;
  }

  function appendErrorNote(text, retryText) {
    const wrapper = document.createElement("div");
    wrapper.style.display = "flex";
    wrapper.style.flexDirection = "column";
    wrapper.style.alignItems = "center";
    wrapper.style.gap = "6px";
    wrapper.style.alignSelf = "center";

    const div = document.createElement("div");
    div.className = "msg error";
    div.textContent = "⚠️ " + text;
    wrapper.appendChild(div);

    if (retryText !== undefined) {
      const retryBtn = document.createElement("button");
      retryBtn.className = "option-btn";
      retryBtn.type = "button";
      retryBtn.textContent = "🔁 Tentar novamente";
      retryBtn.addEventListener("click", () => {
        if (isProcessing) return;
        wrapper.remove();
        sendMessage(retryText);
      });
      wrapper.appendChild(retryBtn);
    }

    messagesEl.appendChild(wrapper);
    scrollToBottom();
    return wrapper;
  }

  // Detecta um bloco de opções numeradas (1. ... 2. ... 3. ...) no FINAL do texto
  // e devolve { body, options } separando o texto principal das opções.
  function extractOptions(rawText) {
    const lines = rawText.split("\n");
    let lastContentIdx = -1;
    for (let i = lines.length - 1; i >= 0; i--) {
      if (lines[i].trim() !== "") { lastContentIdx = i; break; }
    }
    if (lastContentIdx === -1) return { body: rawText, options: null };

    const optionRe = /^\s*(\d{1,2})\.\s+(.+)$/;
    const group = [];
    let cursor = lastContentIdx;
    while (cursor >= 0) {
      const line = lines[cursor];
      if (line.trim() === "") { cursor--; continue; }
      const m = line.match(optionRe);
      if (!m) break;
      group.unshift({ idx: cursor, num: m[1], label: m[2] });
      cursor--;
    }

    if (group.length < 2) return { body: rawText, options: null };

    const firstIdx = group[0].idx;
    const bodyLines = lines.slice(0, firstIdx);
    const body = bodyLines.join("\n").trim();
    const options = group.map((o) => ({
      num: o.num,
      label: o.label.replace(/\*\*/g, "").replace(/[*_`]/g, "").trim(),
    }));
    return { body: body || rawText, options };
  }

  function renderMarkdown(text) {
    if (window.marked && window.DOMPurify) {
      const html = marked.parse(text, { breaks: true });
      return DOMPurify.sanitize(html);
    }
    const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return escaped.replace(/\n/g, "<br>");
  }

  function appendOptionsRow(options) {
    const row = document.createElement("div");
    row.className = "options-row";
    options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.textContent = opt.num + ". " + opt.label;
      btn.addEventListener("click", () => {
        // Checa a trava ANTES de desabilitar os botões: se checássemos depois, um
        // clique ignorado deixaria as opções desabilitadas para sempre.
        if (isProcessing) return;
        Array.from(row.querySelectorAll("button")).forEach((b) => (b.disabled = true));
        sendMessage(opt.num);
      });
      row.appendChild(btn);
    });

    // Opção extra: voltar e mudar a resposta que levou a esta pergunta.
    const backBtn = document.createElement("button");
    backBtn.className = "option-btn";
    backBtn.type = "button";
    backBtn.textContent = "↩️ Voltar e mudar resposta anterior";
    backBtn.addEventListener("click", () => {
      const userTurns = messagesEl.querySelectorAll(".user-turn");
      const lastUserTurn = userTurns[userTurns.length - 1];
      const editBtn = lastUserTurn && lastUserTurn.querySelector(".edit-link");
      if (editBtn) editBtn.click();
    });
    row.appendChild(backBtn);

    messagesEl.appendChild(row);
  }

  function appendClosingRow() {
    const row = document.createElement("div");
    row.className = "options-row";

    const btnNew = document.createElement("button");
    btnNew.className = "option-btn";
    btnNew.type = "button";
    btnNew.textContent = "💬 Tratar outra situação";
    btnNew.addEventListener("click", () => restartConversation());

    const btnEnd = document.createElement("button");
    btnEnd.className = "option-btn";
    btnEnd.type = "button";
    btnEnd.textContent = "✅ Encerrar conversa";
    btnEnd.addEventListener("click", () => {
      Array.from(row.querySelectorAll("button")).forEach((b) => (b.disabled = true));
      const note = document.createElement("div");
      note.className = "msg system-note";
      note.textContent =
        "Conversa encerrada. Que Deus abençoe sua caminhada. 🙏 Você pode salvar o registro em PDF, enviar por WhatsApp, ou reiniciar a qualquer momento pelo botão no topo.";
      messagesEl.appendChild(note);
      scrollToBottom();
    });

    row.appendChild(btnNew);
    row.appendChild(btnEnd);
    messagesEl.appendChild(row);
  }

  // Preenche uma bolha JÁ existente com o texto final e cuida do que vem depois dela
  // (botões de opção, ou o encerramento da conversa).
  // A pessoa NUNCA pode ficar sem saber o que fazer. Quando uma resposta termina
  // sem as opções numeradas — porque o texto foi cortado no limite de tamanho, ou
  // simplesmente parou no meio — mostramos um aviso claro e um botão para pedir a
  // resposta de novo, além de liberar a caixa de digitação.
  function respostaParecerCortada(texto, motivoDoFim) {
    if (motivoDoFim && motivoDoFim !== "STOP") return true; // o Google avisou que cortou
    const fim = texto.trim().slice(-1);
    return fim !== "" && ".!?\"'):]…".indexOf(fim) === -1;
  }

  function appendContinuarRow() {
    const row = document.createElement("div");
    row.className = "options-row";

    const aviso = document.createElement("div");
    aviso.className = "msg system-note";
    aviso.textContent = "A resposta parece ter parado antes do fim.";
    messagesEl.appendChild(aviso);

    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.type = "button";
    btn.textContent = "🔁 Pedir a resposta completa";
    btn.addEventListener("click", () => {
      if (isProcessing) return;
      // Reenvia a última mensagem da pessoa para gerar a resposta de novo.
      const ultima = [...history].reverse().find((m) => m.role === "user");
      if (!ultima) return;
      btn.disabled = true;
      history = history.slice(0, history.length - 1); // tira a resposta incompleta
      sendMessage(ultima.text);
    });
    row.appendChild(btn);
    messagesEl.appendChild(row);
  }

  function renderAssistantInto(div, rawText, motivoDoFim) {
    let text = rawText;
    let isClosing = false;
    if (text.includes(CLOSING_MARKER)) {
      isClosing = true;
      text = text.split(CLOSING_MARKER).join("").trim();
    }

    if (isClosing) {
      div.innerHTML = renderMarkdown(text);
      appendClosingRow();
      inputEl.disabled = true;
      sendBtn.disabled = true;
      // A caixa de digitação some (não há mais o que responder) e os botões de
      // levar o relatório passam a pulsar, indicando o próximo passo natural.
      setInputRowVisible(false);
      destacarBotoesDeExportar(true);
    } else {
      const { body, options } = extractOptions(text);
      div.innerHTML = renderMarkdown(body);
      if (options) {
        appendOptionsRow(options);
        setInputRowVisible(false);
      } else {
        // Sem opções: a pessoa pode digitar livremente. E se o texto parece ter
        // sido cortado, oferecemos também o botão para pedir a resposta completa.
        setInputRowVisible(true);
        if (respostaParecerCortada(text, motivoDoFim)) appendContinuarRow();
      }
    }
  }

  // Caminho antigo (resposta inteira de uma vez) — continua sendo usado pelo plano B.
  function appendAssistantBubble(rawText, motivoDoFim) {
    clearWelcomeNote();
    const div = document.createElement("div");
    div.className = "msg assistant";
    messagesEl.appendChild(div);
    renderAssistantInto(div, rawText, motivoDoFim);
    scrollToStartOf(div);
  }

  // ---- Resposta ao vivo (o texto vai aparecendo enquanto é escrito) ----

  // Enquanto a resposta chega, se a PESSOA rolar a tela por conta própria (dedo ou
  // rodinha do mouse), respeitamos onde ela parou e não puxamos a tela de volta.
  let userScrolledDuringStream = false;
  function markUserScroll() { userScrolledDuringStream = true; }
  function watchUserScroll(on) {
    const alvos = [window, messagesEl];
    const eventos = ["wheel", "touchmove"];
    alvos.forEach((a) =>
      eventos.forEach((e) =>
        on ? a.addEventListener(e, markUserScroll, { passive: true })
           : a.removeEventListener(e, markUserScroll)
      )
    );
  }

  // Cria a bolha vazia no momento em que o primeiro pedaço de texto chega, e já
  // posiciona o início dela no topo da tela para a pessoa começar a ler dali.
  // O "min-height" temporário reserva uma tela inteira de espaço: sem isso, não há
  // como rolar o início da bolha até o topo enquanto ela ainda está quase vazia.
  function beginAssistantStream() {
    clearWelcomeNote();
    const div = document.createElement("div");
    div.className = "msg assistant streaming";
    const embedded = document.documentElement.classList.contains("is-embedded");
    const espaco = embedded ? window.innerHeight : messagesEl.clientHeight;
    div.style.minHeight = Math.max(200, espaco) + "px";
    messagesEl.appendChild(div);
    userScrolledDuringStream = false;
    watchUserScroll(true);
    scrollToStartOf(div);
    return div;
  }

  function finalizeAssistantStream(div, fullText, motivoDoFim) {
    watchUserScroll(false);
    div.classList.remove("streaming");
    div.style.minHeight = "";
    renderAssistantInto(div, fullText, motivoDoFim);
    // Reposiciona o início da resposta no topo — mas só se a pessoa não tiver
    // rolado a tela sozinha enquanto lia, para não arrancá-la de onde estava.
    if (!userScrolledDuringStream) scrollToStartOf(div);
  }

  let loadingPhraseTimer = null;

  function setLoading(isLoading) {
    sendBtn.disabled = isLoading || inputEl.disabled;
    inputEl.disabled = isLoading || inputEl.disabled;
    let typingEl = document.getElementById("typing-indicator");
    if (isLoading) {
      if (!typingEl) {
        typingEl = document.createElement("div");
        typingEl.id = "typing-indicator";
        typingEl.className = "typing";
        typingEl.textContent = LOADING_PHRASES[0];
        messagesEl.appendChild(typingEl);
        scrollToBottom();

        // Troca a frase a cada poucos segundos para dar a sensação de progresso
        // enquanto o modelo responde, em vez de uma palavra parada na tela.
        let phraseIdx = 0;
        loadingPhraseTimer = setInterval(() => {
          phraseIdx = (phraseIdx + 1) % LOADING_PHRASES.length;
          const el = document.getElementById("typing-indicator");
          if (el) el.textContent = LOADING_PHRASES[phraseIdx];
        }, 2800);
      }
    } else {
      if (loadingPhraseTimer) {
        clearInterval(loadingPhraseTimer);
        loadingPhraseTimer = null;
      }
      if (typingEl) typingEl.remove();
    }
  }

  function updateExportButtonsState() {
    const hasContent = history.length > 0;
    whatsappBtn.disabled = !hasContent;
    pdfBtn.disabled = !hasContent;
  }

  // Liga/desliga o brilho pulsante dos botões de WhatsApp e PDF.
  function destacarBotoesDeExportar(ligado) {
    [whatsappBtn, pdfBtn].forEach((b) => b.classList.toggle("destaque", !!ligado));
  }

  function restartConversation() {
    // Se havia uma resposta sendo escrita, cancela de verdade antes de limpar tudo.
    if (activeAbortController) {
      try { activeAbortController.abort(); } catch (e) {}
      activeAbortController = null;
    }
    setLoading(false);
    isProcessing = false;
    destacarBotoesDeExportar(false);
    history = [];
    inputLabelEl.classList.remove("hidden");
    inputEl.value = "";
    resetInputSize();
    inputEl.disabled = false;
    sendBtn.disabled = false;
    setInputRowVisible(true);
    updateExportButtonsState();
    renderWelcome();
    inputEl.focus();
  }

  function commitAssistantReply(attemptedHistory, replyText) {
    history = attemptedHistory;
    history.push({ role: "assistant", text: replyText });
    updateExportButtonsState();
  }

  // Tenta o modo ao vivo. Devolve true se conseguiu mostrar algum texto para a
  // pessoa (mesmo que a conexão tenha caído no meio — nesse caso aproveitamos o
  // que já chegou, em vez de jogar fora). Devolve false se não veio nada, e aí
  // quem chamou parte para o plano B.
  async function streamReply(attemptedHistory, controller) {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-App-Secret": APP_SECRET },
      body: JSON.stringify({ messages: attemptedHistory, stream: true }),
      signal: controller.signal,
    });

    const tipo = res.headers.get("Content-Type") || "";
    if (!res.ok || !res.body || tipo.indexOf("text/event-stream") === -1) return false;

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    let bubble = null;
    let renderTimer = null;
    let motivoDoFim = null;

    // VIGIA DE INATIVIDADE (corrige o travamento no relatório final).
    //
    // Antes existia um cronômetro só para o PRIMEIRO pedaço de texto: assim que ele
    // chegava, o cronômetro era cancelado e a partir dali NADA mais vigiava a
    // conexão. Se o Google parasse no meio do texto — o que acontece justamente na
    // mensagem mais longa, o relatório final — a espera era infinita: o cursor
    // ficava piscando para sempre e a trava interna nunca era liberada, deixando
    // todos os botões do site mortos. Era exatamente o travamento relatado.
    //
    // Agora o cronômetro é REARMADO a cada pedaço que chega. Ele só dispara se a
    // conexão ficar realmente parada, e nesse caso encerramos a leitura, aproveitamos
    // o texto que já chegou e devolvemos o controle do site para a pessoa.
    let watchdog = null;
    let travou = false;
    const rearmarVigia = (ms) => {
      if (watchdog) clearTimeout(watchdog);
      watchdog = setTimeout(() => {
        travou = true;
        try { controller.abort(); } catch (e) {}
      }, ms);
    };
    rearmarVigia(FIRST_CHUNK_TIMEOUT_MS);

    const pintar = () => {
      if (bubble) bubble.innerHTML = renderMarkdown(full.split(CLOSING_MARKER).join(""));
    };

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        // Chegou dado: a conexão está viva, então o vigia recomeça a contagem.
        rearmarVigia(STALL_TIMEOUT_MS);
        buffer += decoder.decode(value, { stream: true });

        let corte;
        while ((corte = buffer.indexOf("\n\n")) !== -1) {
          const bloco = buffer.slice(0, corte);
          buffer = buffer.slice(corte + 2);

          const linha = bloco.split("\n").find((l) => l.startsWith("data:"));
          if (!linha) continue;
          const cru = linha.slice(5).trim();
          if (!cru) continue;

          let obj;
          try { obj = JSON.parse(cru); } catch (e) { continue; }

          if (obj.finishReason) motivoDoFim = obj.finishReason;

          if (typeof obj.t === "string" && obj.t) {
            if (!bubble) {
              setLoading(false);
              bubble = beginAssistantStream();
            }
            full += obj.t;
            // Redesenha no máximo a cada ~90ms: suficiente para parecer contínuo,
            // sem gastar bateria/processamento redesenhando a cada letra.
            if (!renderTimer) {
              renderTimer = setTimeout(() => { renderTimer = null; pintar(); }, 90);
            }
          }
        }
      }
    } catch (e) {
      // Conexão interrompida: seguimos com o que já tiver chegado.
    } finally {
      if (watchdog) clearTimeout(watchdog);
      if (renderTimer) clearTimeout(renderTimer);
    }

    if (!full.trim()) {
      if (bubble) bubble.remove();
      return false;
    }

    // Se a conexão parou no meio, o texto recebido está incompleto. Guardar uma
    // resposta pela metade no histórico bagunçaria as próximas etapas da conversa,
    // então descartamos esse pedaço e devolvemos "false": quem chamou refaz o
    // pedido pelo caminho comum, que espera a resposta inteira e a entrega completa.
    if (travou) {
      if (bubble) bubble.remove();
      setLoading(true);
      return false;
    }

    commitAssistantReply(attemptedHistory, full);
    finalizeAssistantStream(bubble, full, motivoDoFim);
    return true;
  }

  async function sendMessage(forcedText) {
    if (isProcessing) return; // ignora cliques repetidos enquanto já está respondendo

    const text = (forcedText !== undefined ? forcedText : inputEl.value).trim();
    if (!text) return;

    const historyIndexBefore = history.length;
    const userWrapper = appendUserBubble(text, historyIndexBefore);
    if (forcedText === undefined) {
      inputEl.value = "";
      resetInputSize();
    }
    isProcessing = true;
    activeAbortController = new AbortController();
    setLoading(true);

    const attemptedHistory = [...history, { role: "user", text }];

    const falhar = (mensagem) => {
      setLoading(false);
      userWrapper.remove();
      if (forcedText === undefined) {
        inputEl.value = text;
        inputEl.dispatchEvent(new Event("input"));
      }
      // Nunca mostramos o texto técnico do erro (geralmente em inglês) para a
      // pessoa — apenas uma frase simples convidando a tentar de novo.
      appendErrorNote(mensagem, text);
    };

    try {
      // 1) Caminho principal: resposta ao vivo.
      try {
        const deuCerto = await streamReply(attemptedHistory, activeAbortController);
        if (deuCerto) {
          setLoading(false);
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return; // pessoa clicou em "Reiniciar"
        // Streaming indisponível neste navegador/rede — segue para o plano B.
      }

      // 2) Plano B: pedido comum, esperando a resposta inteira.
      // Precisa de um controlador NOVO: o anterior pode já ter sido cancelado pelo
      // vigia de inatividade, e reusá-lo faria este pedido nascer morto.
      activeAbortController = new AbortController();
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-App-Secret": APP_SECRET },
          body: JSON.stringify({ messages: attemptedHistory, stream: false }),
          signal: activeAbortController.signal,
        });

        let data;
        try { data = await res.json(); } catch (e) { data = {}; }

        setLoading(false);

        if (!res.ok || !data.reply) {
          falhar(FRIENDLY_ERROR_TEXT);
          return;
        }

        commitAssistantReply(attemptedHistory, data.reply);
        appendAssistantBubble(data.reply);
      } catch (err) {
        if (err && err.name === "AbortError") return;
        falhar(FRIENDLY_NETWORK_ERROR_TEXT);
      }
    } finally {
      // Libera a trava aconteça o que acontecer — sem isto, uma falha inesperada
      // deixaria o site travado para sempre, sem aceitar novos envios.
      isProcessing = false;
      activeAbortController = null;
    }
  }

  // ---- Exportar conversa ----

  // Para o relatório (WhatsApp/PDF), não faz sentido repetir a lista de opções
  // (1. Sim / 2. Não / 3. Dúvidas) — só a opção que a pessoa realmente escolheu.
  // Esta função limpa a lista de opções de cada pergunta e troca a resposta
  // numérica ("3") pelo texto da opção escolhida ("Dúvidas"), quando aplicável.
  function buildExportableHistory() {
    const result = [];
    let lastOptions = null;
    history.forEach((m) => {
      if (m.role === "assistant") {
        const clean = m.text.split(CLOSING_MARKER).join("").trim();
        const { body, options } = extractOptions(clean);
        result.push({ role: "assistant", text: body });
        lastOptions = options;
      } else {
        let text = m.text;
        if (lastOptions) {
          const match = lastOptions.find((o) => o.num === text.trim());
          if (match) text = match.label;
        }
        result.push({ role: "user", text });
        lastOptions = null;
      }
    });
    return result;
  }

  function buildTranscriptPlainText() {
    return buildExportableHistory()
      .map((m) => {
        const label = m.role === "assistant" ? "Conselheiro" : "Você";
        return label + ":\n" + m.text;
      })
      .join("\n\n");
  }

  function toWhatsAppFormatting(text) {
    // Versiculos (linhas de citacao Markdown "> ...") viram linhas proprias em italico.
    let t = text.replace(/^>\s?(.*)$/gm, "_$1_");
    // Negrito e italico convertidos em UMA unica passada.
    // Antes isto era feito em varias etapas usando um caractere invisivel de controle
    // como marcador temporario. Esse caractere se PERDE ao copiar e colar o arquivo,
    // e quando isso aconteceu a expressao virou /(.+?)/g, que envolvia CADA LETRA do
    // texto em asteriscos e destruia o relatorio. Esta versao nao usa caractere
    // invisivel nenhum, entao pode ser copiada e colada sem risco.
    t = t.replace(/\*\*(.+?)\*\*|\*(.+?)\*/g, function (m, negrito, italico) {
      return negrito !== undefined ? "*" + negrito + "*" : "_" + italico + "_";
    });
    t = t.replace(/^#{1,6}\s*/gm, "");
    t = t.replace(/^-{3,}\s*$/gm, "");
    return t;
  }

  // Para o WhatsApp, em vez da conversa inteira (que pode ficar longa demais e cortar),
  // manda um resumo: a situação inicial, um resumo curto das respostas dadas ao longo do
  // caminho, e a orientação final completa (o conteúdo mais importante para guardar).
  function buildWhatsAppReportText() {
    const exportable = buildExportableHistory();
    const firstUserMsg = exportable.find((m) => m.role === "user");
    const lastAssistantMsg = [...exportable].reverse().find((m) => m.role === "assistant");
    const userAnswers = exportable.filter((m) => m.role === "user").slice(1);

    let text = "*Registro de Aconselhamento Bíblico Cristocêntrico*\n" + new Date().toLocaleDateString("pt-BR") + "\n\n";

    if (firstUserMsg) {
      text += "*Situação relatada:*\n" + firstUserMsg.text + "\n\n";
    }
    if (userAnswers.length) {
      text += "*Respostas ao longo da conversa:*\n";
      userAnswers.forEach((m, i) => {
        text += (i + 1) + ". " + m.text + "\n";
      });
      text += "\n";
    }
    if (lastAssistantMsg) {
      text += "*Orientação final:*\n" + toWhatsAppFormatting(lastAssistantMsg.text) + "\n\n";
    }
    text += "⚠️ *Atenção:*\n" + CRISIS_ALERT_TEXT + "\n\n" + FOOTER_TEXT;
    return text;
  }

  whatsappBtn.addEventListener("click", () => {
    if (!history.length) return;
    const full = buildWhatsAppReportText();
    const encoded = encodeURIComponent(full);
    window.open("https://wa.me/?text=" + encoded, "_blank");
  });

  // Gera o PDF escrevendo o texto diretamente (em vez de "tirar uma foto" da tela),
  // que é o método confiável — a abordagem antiga (fotografar um HTML escondido)
  // às vezes gerava um PDF em branco dependendo do navegador.
  function stripMarkdownForPdf(text) {
    return text
      .split(/\n+/)
      .map((line) => line.trim())
      .filter((line) => line.length > 0)
      .map((line) => {
        let bold = false;
        let quote = false;
        let content = line;
        if (/^>\s?/.test(content)) {
          quote = true;
          content = content.replace(/^>\s?/, "");
        }
        if (/^#{1,6}\s*/.test(content)) {
          bold = true;
          content = content.replace(/^#{1,6}\s*/, "");
        }
        content = content.replace(/\*\*(.+?)\*\*/g, "$1");
        content = content.replace(/\*(.+?)\*/g, "$1");
        content = content.replace(/^-{3,}$/, "");
        content = content.replace(/^[-*]\s+/, "• ");
        return { text: content, bold, quote };
      })
      .filter((l) => l.text.length > 0);
  }

  pdfBtn.addEventListener("click", () => {
    if (!history.length) return;
    if (typeof window.jspdf === "undefined") {
      appendErrorNote("Não foi possível gerar o PDF agora. Verifique sua conexão com a internet e tente novamente.");
      return;
    }
    const originalLabel = pdfBtn.textContent;
    pdfBtn.disabled = true;
    pdfBtn.textContent = "⏳ Gerando PDF…";

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });
      const pageWidth = doc.internal.pageSize.getWidth();
      const pageHeight = doc.internal.pageSize.getHeight();
      const margin = 18;
      const maxWidth = pageWidth - margin * 2;
      let y = margin;

      function ensureSpace(need) {
        if (y + need > pageHeight - margin) {
          doc.addPage();
          y = margin;
        }
      }

      function printParagraphs(text, opts) {
        opts = opts || {};
        const size = opts.size || 11;
        const lineHeight = opts.lineHeight || 6;
        const color = opts.color || [43, 36, 32];
        const quoteColor = [122, 59, 46];
        const paragraphs = stripMarkdownForPdf(text);
        paragraphs.forEach((p) => {
          const indent = p.quote ? 5 : 0;
          if (p.quote) {
            y += 1.5;
            doc.setFont("times", "italic");
            doc.setFontSize(size);
            doc.setTextColor(quoteColor[0], quoteColor[1], quoteColor[2]);
          } else {
            doc.setFont("times", p.bold ? "bold" : "normal");
            doc.setFontSize(p.bold ? size + 1 : size);
            doc.setTextColor(color[0], color[1], color[2]);
          }
          const wrapped = doc.splitTextToSize(p.text, maxWidth - indent);
          wrapped.forEach((w) => {
            ensureSpace(lineHeight);
            doc.text(w, margin + indent, y);
            y += lineHeight;
          });
          y += p.quote ? 2.5 : 1.5;
        });
      }

      // Título
      doc.setFont("times", "bold");
      doc.setFontSize(16);
      doc.setTextColor(92, 44, 34);
      doc.text("Registro de Aconselhamento Bíblico Cristocêntrico", margin, y);
      y += 8;

      // Data
      doc.setFont("times", "normal");
      doc.setFontSize(10);
      doc.setTextColor(107, 95, 82);
      doc.text(new Date().toLocaleDateString("pt-BR"), margin, y);
      y += 10;

      // Conversa
      buildExportableHistory().forEach((m) => {
        const label = m.role === "assistant" ? "CONSELHEIRO BÍBLICO" : "VOCÊ";
        ensureSpace(8);
        doc.setFont("times", "bold");
        doc.setFontSize(9);
        doc.setTextColor(122, 59, 46);
        doc.text(label, margin, y);
        y += 6;
        printParagraphs(m.text, { size: 11, lineHeight: 6, color: [43, 36, 32] });
        y += 4;
      });

      // Alerta de crise
      const crisisLines = stripMarkdownForPdf("Atenção: " + CRISIS_ALERT_TEXT);
      const crisisWrapped = [];
      doc.setFont("times", "bold");
      doc.setFontSize(10);
      crisisLines.forEach((p) => {
        doc.splitTextToSize(p.text, maxWidth - 12).forEach((w) => crisisWrapped.push(w));
      });
      const boxHeight = crisisWrapped.length * 5.5 + 10;
      ensureSpace(boxHeight + 8);
      doc.setFillColor(251, 234, 234);
      doc.setDrawColor(230, 184, 184);
      doc.roundedRect(margin - 4, y - 4, maxWidth + 8, boxHeight, 2, 2, "FD");
      doc.setTextColor(122, 46, 46);
      let cy = y + 3;
      crisisWrapped.forEach((w) => {
        doc.text(w, margin, cy);
        cy += 5.5;
      });
      y += boxHeight + 10;

      // Rodapé
      ensureSpace(8);
      doc.setFont("times", "normal");
      doc.setFontSize(8.5);
      doc.setTextColor(107, 95, 82);
      const footerWidth = doc.getTextWidth(FOOTER_TEXT);
      doc.text(FOOTER_TEXT, (pageWidth - footerWidth) / 2, y);

      const filename = "aconselhamento-biblico-" + new Date().toISOString().slice(0, 10) + ".pdf";
      doc.save(filename);
    } catch (e) {
      appendErrorNote("Não foi possível gerar o PDF agora. Tente novamente.");
    } finally {
      pdfBtn.disabled = false;
      pdfBtn.textContent = originalLabel;
    }
  });

  restartBtn.addEventListener("click", restartConversation);
  sendBtn.addEventListener("click", () => sendMessage());
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  renderWelcome();
  updateExportButtonsState();
</script>

</body>
