<!DOCTYPE html>

<!-- Adianta a conexão com o servidor das bibliotecas externas, economizando tempo no
     primeiro carregamento (especialmente no celular). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<script>
  // Detecta cedo se a página está incorporada (embed) dentro de outra página, como
  // um Google Site — nesse caso a altura do iframe é definida por fora e pode não
  // bater com a tela do celular, o que empurrava o campo "Escreva aqui..." para o
  // meio da tela. Rodando isto ANTES do CSS pintar a página, evitamos qualquer
  // "pulo" visual: html.is-embedded já nasce com a classe certa.
  try {
    if (window.self !== window.top) {
      document.documentElement.classList.add("is-embedded");
    }
  } catch (e) {
    // Acesso entre origens bloqueado pelo navegador só acontece quando já estamos
    // dentro de um iframe de outra origem — ou seja, isso também é sinal de embed.
    document.documentElement.classList.add("is-embedded");
  }
</script>

<style>
  :root {
    --bg: #f6f1e7;
    --bg-panel: #fffdf8;
    --ink: #2b2420;
    --ink-soft: #6b5f52;
    --accent: #7a3b2e;
    --accent-dark: #5c2c22;
    --user-bubble: #eadfc9;
    --bot-bubble: #ffffff;
    --border: #e2d6bd;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Georgia", "Iowan Old Style", serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    max-width: 760px;
    padding: 16px 20px 10px;
    text-align: center;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
  }
  #header-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #header-logo {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }
  header h1 {
    margin: 0;
    font-size: 1.4rem;
    color: var(--accent-dark);
    letter-spacing: 0.02em;
  }
  header p {
    margin: 6px 0 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }
  header p.hidden {
    display: none;
  }
  #input-label {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 6px 20px 4px;
    color: var(--ink);
    font-weight: 600;
    font-size: 1.15rem;
    text-align: center;
    line-height: 1.4;
  }
  #input-label span {
    color: var(--accent);
    font-weight: bold;
  }
  #input-label.hidden {
    display: none;
  }
  /* O rodapé "© Autoconfrontação Bíblica · 2026" foi retirado da TELA para não
     ocupar altura à toa no celular. Ele continua aparecendo no relatório em PDF
     e no texto enviado por WhatsApp, onde a assinatura faz sentido. */
  .welcome-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
    margin: auto;
    padding: 20px 10px;
  }
  .logo-frame {
    position: relative;
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-frame::before {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(247, 200, 119, 0.65) 0%, rgba(247, 200, 119, 0.28) 45%, transparent 72%);
    animation: logo-glow 3s ease-in-out infinite;
    z-index: 0;
  }
  .welcome-hero img {
    position: relative;
    z-index: 1;
    width: 84px;
    height: 84px;
    border-radius: 50%;
  }
  @keyframes logo-glow {
    0%, 100% { transform: scale(0.8); opacity: 0.6; }
    50% { transform: scale(2); opacity: 1; }
  }
  .welcome-hero h2 {
    margin: 0;
    font-size: 1.3rem;
    color: var(--accent-dark);
    letter-spacing: 0.02em;
  }
  .verse-card {
    background: var(--user-bubble);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 22px;
    max-width: 480px;
  }
  .verse-card p {
    margin: 0;
    font-style: italic;
    color: var(--ink);
    line-height: 1.6;
    font-size: 0.98rem;
  }
  .verse-card span {
    display: block;
    margin-top: 10px;
    font-style: normal;
    font-weight: bold;
    color: var(--accent-dark);
    font-size: 0.86rem;
  }
  .welcome-note {
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.85rem;
    margin: 0;
  }
  #chat-container {
    width: 100%;
    max-width: 760px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin: 10px 16px 16px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(90, 60, 30, 0.08);
  }
  #toolbar {
    display: flex;
    gap: 8px;
    padding: 8px 10px;
    border-top: 1px solid var(--border);
    background: #fbf6ea;
    /* nowrap: os três botões ficam SEMPRE na mesma linha, nunca empilhados */
    flex-wrap: nowrap;
    flex-shrink: 0;
    justify-content: center;
    align-items: center;
  }
  .toolbar-btn {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 1 auto;
    min-width: 0;
  }
  .toolbar-btn:hover:not(:disabled) { background: var(--user-bubble); }
  .toolbar-btn:disabled { opacity: 0.4; cursor: default; }

  /* Ao final da conversa, os botões de WhatsApp e PDF pulsam em dourado para
     convidar a pessoa a levar o relatório consigo. */
  .toolbar-btn.destaque:not(:disabled) {
    border-color: #d9a441;
    background: #fffaf0;
    font-weight: 600;
    animation: botao-pulsa 1.8s ease-in-out infinite;
  }
  @keyframes botao-pulsa {
    0%, 100% { box-shadow: 0 0 6px 0 rgba(240, 180, 90, 0.45); transform: scale(1); }
    50% { box-shadow: 0 0 18px 4px rgba(240, 180, 90, 0.9); transform: scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    .toolbar-btn.destaque:not(:disabled) { animation: none; box-shadow: 0 0 12px 2px rgba(240, 180, 90, 0.8); }
  }
  #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 84%;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 0.98rem;
  }
  .msg.user {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
    white-space: pre-wrap;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.assistant p { margin: 0 0 10px; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 {
    color: var(--accent-dark);
    margin: 14px 0 8px;
    font-size: 1.05rem;
  }
  .msg.assistant h1:first-child, .msg.assistant h2:first-child, .msg.assistant h3:first-child { margin-top: 0; }
  .msg.assistant strong { color: var(--accent-dark); }
  .msg.assistant em { color: var(--ink); }
  .msg.assistant ul, .msg.assistant ol { margin: 6px 0; padding-left: 22px; }
  .msg.assistant li { margin-bottom: 4px; }
  .msg.assistant hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .msg.assistant blockquote {
    margin: 10px 0;
    padding: 8px 14px;
    border-left: 3px solid var(--accent);
    background: var(--user-bubble);
    border-radius: 0 8px 8px 0;
    font-style: italic;
    color: var(--accent-dark);
  }
  .msg.assistant blockquote p { margin: 0; }
  .msg.assistant blockquote + blockquote { margin-top: -4px; }
  /* Cursor piscando enquanto a resposta está sendo escrita ao vivo, para deixar
     claro que o texto ainda está chegando e não acabou. */
  .msg.assistant.streaming::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: 1em;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: var(--accent);
    animation: caret-blink 1s steps(1) infinite;
  }
  @keyframes caret-blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .msg.error {
    align-self: center;
    background: #fbeaea;
    border: 1px solid #e6b8b8;
    color: #7a2e2e;
    font-size: 0.9rem;
    text-align: center;
  }
  .msg.system-note {
    align-self: center;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.85rem;
    background: none;
    padding: 4px;
    text-align: center;
  }
  .user-turn {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    align-self: flex-end;
    max-width: 84%;
    gap: 3px;
  }
  .user-turn .msg.user { max-width: 100%; }
  .edit-link {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 0.72rem;
    font-family: inherit;
    cursor: pointer;
    padding: 0 4px;
    opacity: 0.65;
  }
  .edit-link:hover { opacity: 1; text-decoration: underline; }
  .options-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-self: flex-start;
    max-width: 84%;
    margin-top: -6px;
  }
  .option-btn {
    background: var(--bg-panel);
    border: 1.5px solid var(--accent);
    color: var(--accent-dark);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
  }
  .option-btn:hover:not(:disabled) { background: var(--user-bubble); }
  .option-btn:disabled { opacity: 0.4; cursor: default; }

  /* Opções de resposta com contexto (6 a 10 palavras): cada uma ocupa a largura
     toda, em sua própria linha. Em formato de pílula lado a lado, frases desse
     tamanho ficariam espremidas e difíceis de tocar no celular. */
  .options-row--escolhas {
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    max-width: 100%;
    gap: 8px;
    margin-top: 2px;
  }
  .options-row--escolhas .option-btn {
    width: 100%;
    text-align: left;
    border-radius: 12px;
    padding: 11px 14px;
    line-height: 1.35;
    border-width: 1.5px;
  }
  /* Tons pastéis por posição, para a escolha ser reconhecida de relance. */
  .option-btn.opcao-1 { background: #e9f5ea; border-color: #a9d3ad; color: #2f6236; }
  .option-btn.opcao-1:hover:not(:disabled) { background: #dcefde; }
  .option-btn.opcao-2 { background: #e8f0f9; border-color: #a6c6e5; color: #2b5580; }
  .option-btn.opcao-2:hover:not(:disabled) { background: #dae7f5; }
  .option-btn.opcao-3 { background: #fdeee1; border-color: #efc59b; color: #8a4f1f; }
  .option-btn.opcao-3:hover:not(:disabled) { background: #fae3cf; }
  .option-btn.opcao-4 { background: #fdf6db; border-color: #e8d489; color: #766014; }
  .option-btn.opcao-4:hover:not(:disabled) { background: #faefc7; }
  /* "Voltar e mudar resposta anterior" continua neutro: não é uma das escolhas. */
  .option-btn.opcao-voltar {
    background: var(--bg-panel);
    border-color: var(--border);
    color: var(--ink-soft);
    font-size: 0.84rem;
    text-align: center;
  }
  .option-btn.opcao-voltar:hover:not(:disabled) { background: var(--user-bubble); }
  #input-row {
    display: flex;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
    flex-shrink: 0;
  }
  @property --glow-angle {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }
  .input-glow-wrap {
    position: relative;
    flex: 1;
    border-radius: 12px;
    padding: 3px;
    background: conic-gradient(
      from var(--glow-angle),
      var(--accent) 0deg,
      var(--accent) 200deg,
      #f7c877 250deg,
      #fff2cf 290deg,
      #ffffff 300deg,
      #fff2cf 310deg,
      #f7c877 350deg,
      var(--accent) 360deg
    );
    animation: glow-spin 3s linear infinite, glow-pulse 2s ease-in-out infinite;
  }
  @keyframes glow-spin {
    to { --glow-angle: 360deg; }
  }
  @keyframes glow-pulse {
    0%, 100% { box-shadow: 0 0 10px 1px rgba(240, 180, 90, 0.4); }
    50% { box-shadow: 0 0 26px 6px rgba(240, 180, 90, 0.85); }
  }
  #input-row textarea {
    display: block;
    flex: 1;
    width: 100%;
    resize: none;
    border: none;
    border-radius: 9px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.98rem;
    min-height: 44px;
    max-height: 140px;
    background: #fffefb;
    color: var(--ink);
  }
  #input-row textarea:focus {
    outline: 2px solid var(--accent);
  }
  #input-row textarea:disabled {
    background: #f1ede4;
    color: var(--ink-soft);
  }
  #send-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 0.95rem;
    cursor: pointer;
    font-family: inherit;
  }
  #send-btn:hover:not(:disabled) { background: var(--accent-dark); }
  #send-btn:disabled { opacity: 0.5; cursor: default; }
  .typing {
    align-self: flex-start;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 0.9rem;
    padding: 4px 4px;
  }

  @media (max-width: 480px) {
    header { padding: 12px 14px 8px; }
    header h1 { font-size: 1.2rem; }
    #header-logo { width: 26px; height: 26px; }
    header p { font-size: 0.82rem; }
    .welcome-hero img { width: 64px; height: 64px; }
    .logo-frame { width: 64px; height: 64px; }
    .logo-frame::before { inset: -14px; }
    .welcome-hero h2 { font-size: 1.1rem; }
    .verse-card { padding: 12px 16px; }
    .verse-card p { font-size: 0.9rem; }
    #input-label { font-size: 1rem; padding: 0 14px; }
    /* Centralizado na horizontal e aproveitando quase toda a largura da tela. */
    #chat-container {
      margin: 6px auto 8px;
      width: calc(100% - 12px);
      border-radius: 10px;
    }
    #messages { padding: 12px 10px; gap: 10px; }
    /* As respostas passam a ocupar a largura toda: no celular, sobra de margem
       lateral só espreme o texto e força mais rolagem. */
    .msg { max-width: 100%; font-size: 0.94rem; padding: 11px 13px; }
    .msg.assistant { width: 100%; }
    .user-turn { max-width: 88%; }
    .options-row { max-width: 100%; }
    .option-btn { padding: 9px 14px; }
    #toolbar { padding: 7px 6px; gap: 6px; }
    .toolbar-btn { font-size: 0.78rem; padding: 7px 9px; }
    #input-row { padding: 9px; gap: 8px; }
    #send-btn { padding: 0 16px; }
  }

  /* Telas bem estreitas (iPhone SE e afins): encolhe só o texto dos botões, para
     que os três continuem na mesma linha sem quebrar. */
  @media (max-width: 360px) {
    .toolbar-btn { font-size: 0.72rem; padding: 7px 7px; }
    #toolbar { gap: 4px; }
  }

  /* MODO INCORPORADO (embed em Google Sites ou outra página via iframe):
     não dá para confiar que a altura do iframe bate com a tela do celular, então
     abandonamos o layout "tela cheia fixa" (que empurrava o campo de digitação
     para o meio da tela) e deixamos a página fluir normalmente, com o campo de
     digitação grudado (sticky) na parte de baixo da área visível, onde quer que
     a pessoa role a página. */
  html.is-embedded, html.is-embedded body {
    height: auto;
  }
  html.is-embedded body {
    display: block;
  }
  html.is-embedded header {
    position: static;
  }
  html.is-embedded #chat-container {
    flex: none;
    height: auto;
    min-height: 420px;
    /* #chat-container tinha "overflow: hidden" (para arredondar cantos no modo
       tela cheia). Isso, sem querer, cria um contêiner de rolagem próprio e
       impedia o "position: sticky" do campo de digitação de funcionar aqui —
       por isso liberamos o overflow apenas no modo incorporado. */
    overflow: visible;
    border-radius: 14px 14px 0 0;
  }
  html.is-embedded #messages {
    flex: none;
    overflow-y: visible;
    min-height: 200px;
  }
  html.is-embedded #input-row {
    position: sticky;
    bottom: 0;
    z-index: 6;
    box-shadow: 0 -2px 10px rgba(90, 60, 30, 0.06);
  }
</style>
</head>
<body>

<header>
  <div id="header-title-row">
    <img id="header-logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyMDAgMjAwIj4KICA8Y2lyY2xlIGN4PSIxMDAiIGN5PSIxMDAiIHI9Ijk2IiBmaWxsPSIjN2EzYjJlIi8+CiAgPHBhdGggZD0iTTEwMCA0MCBMMTAwIDE2MCBNNjAgODIgTDE0MCA4MiIgc3Ryb2tlPSIjZjZmMWU3IiBzdHJva2Utd2lkdGg9IjE4IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz4KPC9zdmc+Cg==" alt="Logotipo Aconselhamento Bíblico Cristocêntrico" />
    <h1>Aconselhamento Bíblico Cristocêntrico</h1>
  </div>
</header>

<div id="chat-container">
  <div id="messages"></div>
  <p id="input-label">Escreva sua situação e você será ajudado(a) por meio do aconselhamento bíblico cristocêntrico <span aria-hidden="true">↓</span></p>
  <div id="input-row">
    <div class="input-glow-wrap">
      <textarea id="user-input" placeholder="Escreva aqui o que você está enfrentando…" rows="2"></textarea>
    </div>
    <button id="send-btn">Enviar</button>
  </div>
  <div id="toolbar">
    <button id="restart-btn" class="toolbar-btn" title="Apagar tudo e começar uma nova conversa">🔄 Reiniciar</button>
    <button id="whatsapp-btn" class="toolbar-btn" title="Enviar esta conversa pelo WhatsApp" disabled>🟢 WhatsApp</button>
    <button id="pdf-btn" class="toolbar-btn" title="Salvar esta conversa como PDF" disabled>🖨️ PDF</button>
  </div>
</div>


<script>
  // ====== CONFIGURAÇÃO ======
  const WORKER_URL = "https://aconselhamento-biblico.lana-lopes-psicopedagoga.workers.dev";
  const APP_SECRET = "biblico2026";
  const CLOSING_MARKER = "[CONVERSA_CONCLUIDA]";
  const CRISIS_ALERT_TEXT = "Se você estiver passando por uma crise ou sofrimento intenso, não enfrente isso sozinho(a): compartilhe sua dor com pessoas próximas, um pastor ou uma igreja genuinamente cristã, e busque também canais oficiais de apoio — CVV 188 (ligação gratuita, 24h) ou suporte médico/terapêutico profissional.";
  const FOOTER_TEXT = "© Autoconfrontação Bíblica · 2026";
  // Mensagem sempre amigável para qualquer falha do servidor — nunca mostramos o

  const FRIENDLY_ERROR_TEXT = "Não deu para concluir agora. Isso costuma ser passageiro — toque em \"Tentar novamente\" em alguns segundos.";
  const FRIENDLY_NETWORK_ERROR_TEXT = "Não foi possível conectar agora. Verifique sua internet e toque em \"Tentar novamente\".";

  // de fato acontecendo (em vez de uma única palavra estática por até 10-15s).
  const LOADING_PHRASES = ["Refletindo…", "Buscando as Escrituras…", "Preparando uma resposta cuidadosa…"];
  // Tempo máximo esperando o PRIMEIRO pedaço de texto aparecer. Como agora o texto
  // chega ao vivo, esse primeiro pedaço costuma vir em 1 a 2 segundos; se passar
  // disso, algo está errado e partimos para o plano B em vez de deixar a pessoa parada.
  const FIRST_CHUNK_TIMEOUT_MS = 20000;
  // Depois que o texto começou a chegar, quanto tempo aceitamos a conexão ficar
  // PARADA antes de considerar que travou. Generoso o bastante para o relatório
  // final (que é longo e tem pausas naturais), curto o bastante para nunca deixar
  // a pessoa presa olhando um cursor que não anda.
  const STALL_TIMEOUT_MS = 25000;

  const messagesEl = document.getElementById("messages");
  const inputRowEl = document.getElementById("input-row");
  const inputEl = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");
  const inputLabelEl = document.getElementById("input-label");
  const restartBtn = document.getElementById("restart-btn");
  const whatsappBtn = document.getElementById("whatsapp-btn");
  const pdfBtn = document.getElementById("pdf-btn");

  // A conversa vive só na memória desta aba. Recarregar a página, ou clicar em

  let history = [];

  // Trava contra cliques repetidos: enquanto uma resposta está sendo buscada ou
  // escrita, novos envios são ignorados (antes, dois toques rápidos no botão
  // disparavam duas conversas ao mesmo tempo e bagunçavam o histórico).
  let isProcessing = false;
  // Permite cancelar de verdade a resposta em andamento ao clicar em "Reiniciar".

  // Ao chegar uma nova resposta do conselheiro, a tela deve rolar até o INÍCIO

  // A caixa de digitação livre só aparece na primeira mensagem (para descrever a
  // situação) e enquanto não houver botões de opção para responder. Depois disso,

  // resposta anterior, quando ela volta a aparecer.
  function setInputRowVisible(visible) {

  function truncateFromInclusive(node) {
    let el = node;
    while (el) {
      const next = el.nextSibling;
      el.remove();
      el = next;

      // A conversa vai mudar de rumo: o que estava sendo preparado não vale mais.
      limparPreBusca();
      truncateFromInclusive(wrapper);
      history = history.slice(0, historyIndexBefore);

  function appendErrorNote(text, retryText) {
    const wrapper = document.createElement("div");
    wrapper.style.display = "flex";
    wrapper.style.flexDirection = "column";
    wrapper.style.alignItems = "center";
    wrapper.style.gap = "6px";

    div.className = "msg error";
    div.textContent = "⚠️ " + text;
    wrapper.appendChild(div);

    if (retryText !== undefined) {
      const retryBtn = document.createElement("button");
      retryBtn.className = "option-btn";
      retryBtn.type = "button";
      retryBtn.textContent = "🔁 Tentar novamente";
      retryBtn.addEventListener("click", () => {
        if (isProcessing) return;
        wrapper.remove();
        sendMessage(retryText);
      });
      wrapper.appendChild(retryBtn);

  // Detecta um bloco de opções numeradas (1. ... 2. ... 3. ...) no FINAL do texto
  // e devolve { body, options } separando o texto principal das opções.
  function extractOptions(rawText) {
    const lines = rawText.split("\n");
    let lastContentIdx = -1;
    for (let i = lines.length - 1; i >= 0; i--) {
      if (lines[i].trim() !== "") { lastContentIdx = i; break; }
    }
    if (lastContentIdx === -1) return { body: rawText, options: null };

    const optionRe = /^\s*(\d{1,2})\.\s+(.+)$/;
    const group = [];
    let cursor = lastContentIdx;
    while (cursor >= 0) {
      const line = lines[cursor];
      if (line.trim() === "") { cursor--; continue; }
      const m = line.match(optionRe);
      if (!m) break;
      group.unshift({ idx: cursor, num: m[1], label: m[2] });
      cursor--;
    }

    if (group.length < 2) return { body: rawText, options: null };

    const firstIdx = group[0].idx;
    const bodyLines = lines.slice(0, firstIdx);
    const body = bodyLines.join("\n").trim();
    const options = group.map((o) => ({
      num: o.num,
      label: o.label.replace(/\*\*/g, "").replace(/[*_`]/g, "").trim(),
    }));
    return { body: body || rawText, options };
  }

  function renderMarkdown(text) {
    if (window.marked && window.DOMPurify) {
      const html = marked.parse(text, { breaks: true });
      return DOMPurify.sanitize(html);
    }
    const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return escaped.replace(/\n/g, "<br>");
  }

  function appendOptionsRow(options) {
    const row = document.createElement("div");
    row.className = "options-row options-row--escolhas";
    options.forEach((opt, i) => {
      const btn = document.createElement("button");
      // A cor segue a POSIÇÃO da opção (1ª verde, 2ª azul, 3ª laranja, 4ª amarela).
      btn.className = "option-btn opcao-" + Math.min(i + 1, 4);
      btn.type = "button";
      btn.textContent = opt.num + ". " + opt.label;
      btn.addEventListener("click", () => {
        // Checa a trava ANTES de desabilitar os botões: se checássemos depois, um
        // clique ignorado deixaria as opções desabilitadas para sempre.
        if (isProcessing) return;
        Array.from(row.querySelectorAll("button")).forEach((b) => (b.disabled = true));
        sendMessage(opt.num);
      });
      row.appendChild(btn);
    });

    // Opção extra: voltar e mudar a resposta que levou a esta pergunta.
    const backBtn = document.createElement("button");
    backBtn.className = "option-btn opcao-voltar";
    backBtn.type = "button";
    backBtn.textContent = "↩️ Voltar e mudar resposta anterior";
    backBtn.addEventListener("click", () => {
      const userTurns = messagesEl.querySelectorAll(".user-turn");
      const lastUserTurn = userTurns[userTurns.length - 1];
      const editBtn = lastUserTurn && lastUserTurn.querySelector(".edit-link");
      if (editBtn) editBtn.click();
    });
    row.appendChild(backBtn);

    messagesEl.appendChild(row);
  }

  function appendClosingRow() {
    const row = document.createElement("div");
    row.className = "options-row";

    const btnNew = document.createElement("button");
    btnNew.className = "option-btn";
    btnNew.type = "button";
    btnNew.textContent = "💬 Tratar outra situação";
    btnNew.addEventListener("click", () => restartConversation());

    const btnEnd = document.createElement("button");
    btnEnd.className = "option-btn";
    btnEnd.type = "button";
    btnEnd.textContent = "✅ Encerrar conversa";
    btnEnd.addEventListener("click", () => {

        "Conversa encerrada. Que Deus abençoe sua caminhada. 🙏 Você pode salvar o registro em PDF, enviar por WhatsApp, ou reiniciar a qualquer momento pelo botão no topo.";

  // Preenche uma bolha JÁ existente com o texto final e cuida do que vem depois dela
  // (botões de opção, ou o encerramento da conversa).
  // O texto só é considerado interrompido quando o PRÓPRIO GOOGLE avisa que parou
  // antes da hora. "STOP" (ou nenhum aviso) significa que terminou normalmente.
  //
  // A versão anterior também "adivinhava" pela pontuação final — se o texto não
  // terminasse com ponto, ela declarava a resposta cortada. Isso disparava alarme
  // falso o tempo todo (uma resposta que termina com as opções numeradas não acaba
  // em ponto), enchendo a tela de avisos e desanimando quem estava sendo aconselhado.
  // Essa adivinhação foi removida: agora só confiamos no aviso oficial.
  // O Google sempre carimba o último pedaço com o motivo do término. Portanto:
  //  - "STOP"            -> terminou de escrever normalmente;
  //  - qualquer outro    -> parou antes da hora (limite de tamanho, filtro, etc.);
  //  - NENHUM motivo     -> a conexão morreu antes do fim, então também está incompleto.
  function textoFoiInterrompido(motivoDoFim) {
    return motivoDoFim !== "STOP";
  }

  function renderAssistantInto(div, rawText, motivoDoFim) {
    let text = rawText;
    let isClosing = false;
    if (text.includes(CLOSING_MARKER)) {
      isClosing = true;
      text = text.split(CLOSING_MARKER).join("").trim();
    }

    if (isClosing) {
      div.innerHTML = renderMarkdown(text);
      appendClosingRow();
      inputEl.disabled = true;
      sendBtn.disabled = true;
      // A caixa de digitação some (não há mais o que responder) e os botões de
      // levar o relatório passam a pulsar, indicando o próximo passo natural.
      setInputRowVisible(false);
      destacarBotoesDeExportar(true);
    } else {
      const { body, options } = extractOptions(text);
      div.innerHTML = renderMarkdown(body);
      if (options) {
        appendOptionsRow(options);
        setInputRowVisible(false);
        // Enquanto a pessoa lê esta resposta, o sistema já vai preparando em
        // segundo plano o que viria a seguir para cada opção. Começa depois de um
        // instante, para não disputar espaço com o que ainda está sendo desenhado.
        agendarPreBusca(options);
      } else {
        // Sem opções numeradas: a pessoa responde escrevendo livremente.
        setInputRowVisible(true);
      }
    }
  }

  // Caminho antigo (resposta inteira de uma vez) — continua sendo usado pelo plano B.
  function appendAssistantBubble(rawText, motivoDoFim) {
    clearWelcomeNote();
    const div = document.createElement("div");
    div.className = "msg assistant";
    messagesEl.appendChild(div);
    renderAssistantInto(div, rawText, motivoDoFim);
    scrollToStartOf(div);
  }

  // ---- Resposta ao vivo (o texto vai aparecendo enquanto é escrito) ----

  // Enquanto a resposta chega, se a PESSOA rolar a tela por conta própria (dedo ou
  // rodinha do mouse), respeitamos onde ela parou e não puxamos a tela de volta.
  let userScrolledDuringStream = false;
  function markUserScroll() { userScrolledDuringStream = true; }
  function watchUserScroll(on) {
    const alvos = [window, messagesEl];
    const eventos = ["wheel", "touchmove"];
    alvos.forEach((a) =>
      eventos.forEach((e) =>
        on ? a.addEventListener(e, markUserScroll, { passive: true })
           : a.removeEventListener(e, markUserScroll)
      )
    );
  }

  // Cria a bolha vazia no momento em que o primeiro pedaço de texto chega, e já
  // posiciona o início dela no topo da tela para a pessoa começar a ler dali.
  // O "min-height" temporário reserva uma tela inteira de espaço: sem isso, não há
  // como rolar o início da bolha até o topo enquanto ela ainda está quase vazia.
  function beginAssistantStream() {
    clearWelcomeNote();
    const div = document.createElement("div");
    div.className = "msg assistant streaming";
    const embedded = document.documentElement.classList.contains("is-embedded");
    const espaco = embedded ? window.innerHeight : messagesEl.clientHeight;
    div.style.minHeight = Math.max(200, espaco) + "px";
    messagesEl.appendChild(div);
    userScrolledDuringStream = false;
    watchUserScroll(true);
    scrollToStartOf(div);
    return div;
  }

  function finalizeAssistantStream(div, fullText, motivoDoFim) {
    watchUserScroll(false);
    div.classList.remove("streaming");
    div.style.minHeight = "";
    renderAssistantInto(div, fullText, motivoDoFim);
    // Reposiciona o início da resposta no topo — mas só se a pessoa não tiver
    // rolado a tela sozinha enquanto lia, para não arrancá-la de onde estava.
    if (!userScrolledDuringStream) scrollToStartOf(div);
  }

  let loadingPhraseTimer = null;

  function setLoading(isLoading) {
    sendBtn.disabled = isLoading || inputEl.disabled;
    inputEl.disabled = isLoading || inputEl.disabled;
    let typingEl = document.getElementById("typing-indicator");
    if (isLoading) {
      if (!typingEl) {
        typingEl = document.createElement("div");
        typingEl.id = "typing-indicator";
        typingEl.className = "typing";
        typingEl.textContent = LOADING_PHRASES[0];
        messagesEl.appendChild(typingEl);
        scrollToBottom();

        // Troca a frase a cada poucos segundos para dar a sensação de progresso
        // enquanto o modelo responde, em vez de uma palavra parada na tela.
        let phraseIdx = 0;
        loadingPhraseTimer = setInterval(() => {
          phraseIdx = (phraseIdx + 1) % LOADING_PHRASES.length;
          const el = document.getElementById("typing-indicator");
          if (el) el.textContent = LOADING_PHRASES[phraseIdx];
        }, 2800);
      }
    } else {
      if (loadingPhraseTimer) {
        clearInterval(loadingPhraseTimer);
        loadingPhraseTimer = null;
      }
      if (typingEl) typingEl.remove();
    }
  }

  function updateExportButtonsState() {
    const hasContent = history.length > 0;
    whatsappBtn.disabled = !hasContent;
    pdfBtn.disabled = !hasContent;
  }

  // Liga/desliga o brilho pulsante dos botões de WhatsApp e PDF.
  function destacarBotoesDeExportar(ligado) {
    [whatsappBtn, pdfBtn].forEach((b) => b.classList.toggle("destaque", !!ligado));
  }

  function restartConversation() {
    // Se havia uma resposta sendo escrita, cancela de verdade antes de limpar tudo.
    if (activeAbortController) {
      try { activeAbortController.abort(); } catch (e) {}
      activeAbortController = null;
    }
    setLoading(false);
    isProcessing = false;
    limparPreBusca();
    destacarBotoesDeExportar(false);
    history = [];
    inputLabelEl.classList.remove("hidden");
    inputEl.value = "";
    resetInputSize();
    inputEl.disabled = false;
    sendBtn.disabled = false;
    setInputRowVisible(true);
    updateExportButtonsState();
    renderWelcome();
    inputEl.focus();
  }

  function commitAssistantReply(attemptedHistory, replyText) {
    history = attemptedHistory;
    history.push({ role: "assistant", text: replyText });
    updateExportButtonsState();
  }

  // ---- Respostas adiantadas (preparadas em segundo plano) ----
  //
  // Como toda pergunta termina em opções numeradas, o sistema sabe EXATAMENTE
  // qual será a próxima mensagem da pessoa: "1", "2" ou "3". Não é adivinhação.
  // Então, enquanto ela lê a resposta atual — 30 a 60 segundos de tempo ocioso —
  // já pedimos ao servidor o que viria depois de cada escolha e guardamos aqui.
  // Quando ela clica, a resposta aparece na hora, sem espera nenhuma.
  //
  // As preparações são feitas UMA DE CADA VEZ, começando pela opção 1 (a mais
  // escolhida). Isso é proposital: se a pessoa decide rápido, gastamos só uma
  // chamada extra; se ela lê com calma, dá tempo de preparar todas. E, por não
  // disparar vários pedidos no mesmo instante, não corremos o risco de bater no
  // limite de uso por minuto do plano gratuito.
  // Quantas opções, no máximo, podem ser preparadas por pergunta.
  // 3 = prepara todas (mais rápido, gasta mais cota gratuita).
  // 1 = prepara só a opção 1, que é a mais escolhida (bem mais econômico).
  // Basta trocar este número se um dia o uso crescer e a cota apertar.
  const MAX_OPCOES_PREPARADAS = 3;

  const cacheAdiantado = new Map();
  let cacheParaHistorico = -1;      // a que ponto da conversa este cache pertence
  let preBuscaGeracao = 0;          // invalida cadeias antigas
  let preBuscaControllers = [];     // permite cancelar pedidos ainda em voo
  let preBuscaEmVoo = null;         // { opcao, promessa } do pedido deste instante
  let preBuscaTimer = null;         // espera antes de começar a preparar

  // A preparação começa alguns instantes depois da resposta aparecer. Se a pessoa
  // escolher antes disso, este agendamento precisa ser cancelado — senão ele
  // dispararia no meio da próxima pergunta e gastaria cota à toa.
  function agendarPreBusca(opcoes) {
    if (preBuscaTimer) clearTimeout(preBuscaTimer);
    preBuscaTimer = setTimeout(() => {
      preBuscaTimer = null;
      iniciarPreBusca(opcoes);
    }, 500);
  }

  // Para de PEDIR novas opções, mas deixa terminar o pedido que já está em voo —
  // ele pode ser justamente o que a pessoa acabou de escolher, e desperdiçá-lo
  // seria gastar cota duas vezes pela mesma resposta.
  function pararPreBusca() {
    preBuscaGeracao++;
    if (preBuscaTimer) { clearTimeout(preBuscaTimer); preBuscaTimer = null; }
  }

  // Interrompe e DESCARTA tudo — usado quando a conversa muda de rumo (a pessoa
  // voltou para mudar uma resposta, ou reiniciou), pois o que estava preparado
  // deixou de valer.
  function limparPreBusca() {
    preBuscaGeracao++;
    if (preBuscaTimer) { clearTimeout(preBuscaTimer); preBuscaTimer = null; }
    preBuscaControllers.forEach((c) => { try { c.abort(); } catch (e) {} });
    preBuscaControllers = [];
    preBuscaEmVoo = null;
    cacheAdiantado.clear();
    cacheParaHistorico = -1;
  }

  function pegarRespostaAdiantada(texto) {
    // Só serve se tiver sido preparada exatamente para este ponto da conversa.
    if (cacheParaHistorico !== history.length) return null;
    return cacheAdiantado.get(String(texto).trim()) || null;
  }

  // Se a opção que a pessoa acabou de escolher é exatamente a que está sendo
  // preparada neste instante, aproveitamos aquele mesmo pedido em vez de abrir
  // outro igual: economiza uma chamada e ainda chega antes.
  function adotarPreBuscaEmVoo(texto) {
    if (cacheParaHistorico !== history.length) return null;
    if (preBuscaEmVoo && preBuscaEmVoo.opcao === String(texto).trim()) return preBuscaEmVoo.promessa;
    return null;
  }

  async function buscarOpcao(baseHistorico, numero, controller) {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-App-Secret": APP_SECRET },
      // Sem transmissão ao vivo: aqui queremos o texto completo de uma vez,
      // já que ninguém está olhando enquanto ele é preparado.
      body: JSON.stringify({
        messages: baseHistorico.concat([{ role: "user", text: numero }]),
        stream: false,
      }),
      signal: controller.signal,
    });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data || !data.reply) return null;
    // REGRA ABSOLUTA: uma resposta cortada NUNCA entra no cache. Se guardássemos,
    // ela seria entregue instantaneamente na escolha da pessoa — cortada, sem
    // opções no fim e sem nenhuma saída. Melhor não ter nada preparado e buscar
    // na hora do que entregar pela metade.
    if (textoFoiInterrompido(data.finishReason)) return null;
    return data.reply;
  }

  async function iniciarPreBusca(opcoes) {
    limparPreBusca();
    if (!opcoes || !opcoes.length) return;

    const geracao = ++preBuscaGeracao;
    const baseHistorico = history.slice();
    cacheParaHistorico = baseHistorico.length;

    for (const opt of opcoes.slice(0, MAX_OPCOES_PREPARADAS)) {
      // Se a conversa mudou de rumo, a cadeia morre aqui.
      if (geracao !== preBuscaGeracao) return;

      const numero = String(opt.num);
      const controller = new AbortController();
      preBuscaControllers.push(controller);

      const promessa = buscarOpcao(baseHistorico, numero, controller)
        .then((texto) => {
          if (texto) cacheAdiantado.set(numero, texto);
          return texto;
        })
        .catch(() => null)
        .finally(() => {
          if (preBuscaEmVoo && preBuscaEmVoo.promessa === promessa) preBuscaEmVoo = null;
        });

      preBuscaEmVoo = { opcao: numero, promessa };
      await promessa;
    }
  }

  // Tenta o modo ao vivo. Devolve true se conseguiu mostrar algum texto para a
  // pessoa (mesmo que a conexão tenha caído no meio — nesse caso aproveitamos o
  // que já chegou, em vez de jogar fora). Devolve false se não veio nada, e aí
  // quem chamou parte para o plano B.
  async function streamReply(attemptedHistory, controller) {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-App-Secret": APP_SECRET },
      body: JSON.stringify({ messages: attemptedHistory, stream: true }),
      signal: controller.signal,
    });

    const tipo = res.headers.get("Content-Type") || "";
    if (!res.ok || !res.body || tipo.indexOf("text/event-stream") === -1) return false;

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let full = "";
    let bubble = null;
    let renderTimer = null;
    let motivoDoFim = null;

    // VIGIA DE INATIVIDADE (corrige o travamento no relatório final).
    //
    // Antes existia um cronômetro só para o PRIMEIRO pedaço de texto: assim que ele
    // chegava, o cronômetro era cancelado e a partir dali NADA mais vigiava a
    // conexão. Se o Google parasse no meio do texto — o que acontece justamente na
    // mensagem mais longa, o relatório final — a espera era infinita: o cursor
    // ficava piscando para sempre e a trava interna nunca era liberada, deixando
    // todos os botões do site mortos. Era exatamente o travamento relatado.
    //
    // Agora o cronômetro é REARMADO a cada pedaço que chega. Ele só dispara se a
    // conexão ficar realmente parada, e nesse caso encerramos a leitura, aproveitamos
    // o texto que já chegou e devolvemos o controle do site para a pessoa.
    let watchdog = null;
    let travou = false;
    const rearmarVigia = (ms) => {
      if (watchdog) clearTimeout(watchdog);
      watchdog = setTimeout(() => {
        travou = true;
        try { controller.abort(); } catch (e) {}
      }, ms);
    };
    rearmarVigia(FIRST_CHUNK_TIMEOUT_MS);

    const pintar = () => {
      if (bubble) bubble.innerHTML = renderMarkdown(full.split(CLOSING_MARKER).join(""));
    };

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        // Chegou dado: a conexão está viva, então o vigia recomeça a contagem.
        rearmarVigia(STALL_TIMEOUT_MS);
        buffer += decoder.decode(value, { stream: true });

        let corte;
        while ((corte = buffer.indexOf("\n\n")) !== -1) {
          const bloco = buffer.slice(0, corte);
          buffer = buffer.slice(corte + 2);

          const linha = bloco.split("\n").find((l) => l.startsWith("data:"));
          if (!linha) continue;
          const cru = linha.slice(5).trim();
          if (!cru) continue;

          let obj;
          try { obj = JSON.parse(cru); } catch (e) { continue; }

          // Agora lemos o formato ORIGINAL do Google (o Worker repassa direto,
          // sem remontar nada): o texto novo vem em candidates[0].content.parts,
          // e o motivo do término em candidates[0].finishReason.
          const cand = obj && obj.candidates && obj.candidates[0];
          if (cand && cand.finishReason) motivoDoFim = cand.finishReason;

          const pedaco =
            (cand && cand.content && cand.content.parts
              ? cand.content.parts.map((pt) => pt.text || "").join("")
              : "") || "";

          if (pedaco) {
            if (!bubble) {
              setLoading(false);
              bubble = beginAssistantStream();
            }
            full += pedaco;
            // Redesenha no máximo a cada ~90ms: suficiente para parecer contínuo,
            // sem gastar bateria/processamento redesenhando a cada letra.
            if (!renderTimer) {
              renderTimer = setTimeout(() => { renderTimer = null; pintar(); }, 90);
            }
          }
        }
      }
    } catch (e) {
      // Conexão interrompida: seguimos com o que já tiver chegado.
    } finally {
      if (watchdog) clearTimeout(watchdog);
      if (renderTimer) clearTimeout(renderTimer);
    }

    if (!full.trim()) {
      if (bubble) bubble.remove();
      return false;
    }

    // Texto incompleto — porque a conexão parou, ou porque o Google interrompeu a
    // geração no meio. Em vez de mostrar um aviso desanimador e empurrar o trabalho
    // para a pessoa, descartamos silenciosamente e devolvemos "false": quem chamou
    // refaz o pedido sozinho pelo caminho comum. Ela só vê a resposta boa chegar,
    // um pouco depois — sem nunca saber que houve uma segunda tentativa.
    if (travou || textoFoiInterrompido(motivoDoFim)) {
      if (bubble) bubble.remove();
      setLoading(true);
      return false;
    }

    commitAssistantReply(attemptedHistory, full);
    finalizeAssistantStream(bubble, full, motivoDoFim);
    return true;
  }

  async function sendMessage(forcedText) {
    if (isProcessing) return; // ignora cliques repetidos enquanto já está respondendo

    const text = (forcedText !== undefined ? forcedText : inputEl.value).trim();
    if (!text) return;

    // A pessoa escolheu: se já preparamos esta resposta em segundo plano, ela sai
    // na hora. Se ela está sendo preparada agora, aproveitamos esse mesmo pedido.
    // Nos dois casos, paramos de preparar as outras, que não servem mais.
    const jaPronta = pegarRespostaAdiantada(text);
    const emPreparo = jaPronta ? null : adotarPreBuscaEmVoo(text);
    pararPreBusca();

    const historyIndexBefore = history.length;
    const userWrapper = appendUserBubble(text, historyIndexBefore);
    if (forcedText === undefined) {
      inputEl.value = "";
      resetInputSize();
    }
    isProcessing = true;
    activeAbortController = new AbortController();

    const attemptedHistory = [...history, { role: "user", text }];

    // Só liga o "Refletindo…" se realmente houver espera pela frente.
    if (!jaPronta) setLoading(true);

    const falhar = (mensagem) => {
      setLoading(false);
      userWrapper.remove();
      if (forcedText === undefined) {
        inputEl.value = text;
        inputEl.dispatchEvent(new Event("input"));
      }
      // Nunca mostramos o texto técnico do erro (geralmente em inglês) para a
      // pessoa — apenas uma frase simples convidando a tentar de novo.
      appendErrorNote(mensagem, text);
    };

    try {
      // 0a) Instantâneo: a resposta desta opção já estava pronta, esperando.
      if (jaPronta) {
        commitAssistantReply(attemptedHistory, jaPronta);
        appendAssistantBubble(jaPronta);
        return;
      }

      // 0b) Quase pronta: o pedido desta mesma opção já estava em andamento.
      // Basta esperar ele terminar, em vez de começar outro igual do zero.
      if (emPreparo) {
        let texto = null;
        try { texto = await emPreparo; } catch (e) { texto = null; }
        if (texto) {
          setLoading(false);
          commitAssistantReply(attemptedHistory, texto);
          appendAssistantBubble(texto);
          return;
        }
        // Se não deu certo, segue normalmente pelos caminhos abaixo.
      }

      // 1) Caminho principal: resposta ao vivo.
      try {
        const deuCerto = await streamReply(attemptedHistory, activeAbortController);
        if (deuCerto) {
          setLoading(false);
          return;
        }
      } catch (e) {
        if (e && e.name === "AbortError") return; // pessoa clicou em "Reiniciar"
        // Streaming indisponível neste navegador/rede — segue para o plano B.
      }

      // 2) Plano B: pedido comum, esperando a resposta inteira.
      //
      // Tenta até duas vezes, e SÓ aceita um texto que o Google tenha declarado
      // completo. Uma resposta cortada nunca é mostrada: ela deixa a pessoa sem
      // as opções de continuar, que é justamente o travamento que queremos
      // eliminar. Se as duas tentativas vierem cortadas, preferimos a mensagem
      // amigável com o botão "Tentar novamente" — nunca um texto pela metade.
      let completa = null;
      let houveRede = false;

      for (let tentativa = 0; tentativa < 2 && !completa; tentativa++) {
        // Controlador NOVO a cada tentativa: o anterior pode já ter sido
        // cancelado pelo vigia de inatividade, e reusá-lo faria o pedido
        // nascer morto.
        activeAbortController = new AbortController();
        try {
          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-App-Secret": APP_SECRET },
            body: JSON.stringify({ messages: attemptedHistory, stream: false }),
            signal: activeAbortController.signal,
          });

          let data;
          try { data = await res.json(); } catch (e) { data = {}; }

          if (res.ok && data.reply && !textoFoiInterrompido(data.finishReason)) {
            completa = data.reply;
          }
        } catch (err) {
          if (err && err.name === "AbortError") return;
          houveRede = true;
          break;
        }
      }

      setLoading(false);

      if (!completa) {
        falhar(houveRede ? FRIENDLY_NETWORK_ERROR_TEXT : FRIENDLY_ERROR_TEXT);
        return;
      }

      commitAssistantReply(attemptedHistory, completa);
      appendAssistantBubble(completa);
    } finally {
      // Libera a trava aconteça o que acontecer — sem isto, uma falha inesperada
      // deixaria o site travado para sempre, sem aceitar novos envios.
      isProcessing = false;
      activeAbortController = null;
    }
  }

  // ---- Exportar conversa ----

  // Para o relatório (WhatsApp/PDF), não faz sentido repetir a lista de opções
  // (1. Sim / 2. Não / 3. Dúvidas) — só a opção que a pessoa realmente escolheu.
  // Esta função limpa a lista de opções de cada pergunta e troca a resposta
  // numérica ("3") pelo texto da opção escolhida ("Dúvidas"), quando aplicável.
  function buildExportableHistory() {
    const result = [];
    let lastOptions = null;
    history.forEach((m) => {
      if (m.role === "assistant") {
        const clean = m.text.split(CLOSING_MARKER).join("").trim();
        const { body, options } = extractOptions(clean);
        result.push({ role: "assistant", text: body });
        lastOptions = options;
      } else {
        let text = m.text;
        if (lastOptions) {
          const match = lastOptions.find((o) => o.num === text.trim());
          if (match) text = match.label;
        }
        result.push({ role: "user", text });
        lastOptions = null;
      }
    });
    return result;
  }

  function buildTranscriptPlainText() {
    return buildExportableHistory()
      .map((m) => {
        const label = m.role === "assistant" ? "Conselheiro" : "Você";
        return label + ":\n" + m.text;
      })
      .join("\n\n");
  }

  function toWhatsAppFormatting(text) {
    // Versiculos (linhas de citacao Markdown "> ...") viram linhas proprias em italico.
    let t = text.replace(/^>\s?(.*)$/gm, "_$1_");
    // Negrito e italico convertidos em UMA unica passada.
    // Antes isto era feito em varias etapas usando um caractere invisivel de controle
    // como marcador temporario. Esse caractere se PERDE ao copiar e colar o arquivo,
    // e quando isso aconteceu a expressao virou /(.+?)/g, que envolvia CADA LETRA do
    // texto em asteriscos e destruia o relatorio. Esta versao nao usa caractere
    // invisivel nenhum, entao pode ser copiada e colada sem risco.
    t = t.replace(/\*\*(.+?)\*\*|\*(.+?)\*/g, function (m, negrito, italico) {
      return negrito !== undefined ? "*" + negrito + "*" : "_" + italico + "_";
    });
    t = t.replace(/^#{1,6}\s*/gm, "");
    t = t.replace(/^-{3,}\s*$/gm, "");
    return t;
  }

  // Para o WhatsApp, em vez da conversa inteira (que pode ficar longa demais e cortar),
  // manda um resumo: a situação inicial, um resumo curto das respostas dadas ao longo do
  // caminho, e a orientação final completa (o conteúdo mais importante para guardar).
  function buildWhatsAppReportText() {
    const exportable = buildExportableHistory();
    const firstUserMsg = exportable.find((m) => m.role === "user");
    const lastAssistantMsg = [...exportable].reverse().find((m) => m.role === "assistant");
    const userAnswers = exportable.filter((m) => m.role === "user").slice(1);

    let text = "*Registro de Aconselhamento Bíblico Cristocêntrico*\n" + new Date().toLocaleDateString("pt-BR") + "\n\n";

    if (firstUserMsg) {
      text += "*Situação relatada:*\n" + firstUserMsg.text + "\n\n";
    }
    if (userAnswers.length) {
      text += "*Respostas ao longo da conversa:*\n";
      userAnswers.forEach((m, i) => {
        text += (i + 1) + ". " + m.text + "\n";
      });
      text += "\n";
    }
    if (lastAssistantMsg) {
      text += "*Orientação final:*\n" + toWhatsAppFormatting(lastAssistantMsg.text) + "\n\n";
    }
    text += "⚠️ *Atenção:*\n" + CRISIS_ALERT_TEXT + "\n\n" + FOOTER_TEXT;
    return text;
  }

  whatsappBtn.addEventListener("click", () => {
    if (!history.length) return;
    const full = buildWhatsAppReportText();
    const encoded = encodeURIComponent(full);
    window.open("https://wa.me/?text=" + encoded, "_blank");
  });

  // Gera o PDF escrevendo o texto diretamente (em vez de "tirar uma foto" da tela),
  // que é o método confiável — a abordagem antiga (fotografar um HTML escondido)
  // às vezes gerava um PDF em branco dependendo do navegador.
  function stripMarkdownForPdf(text) {
    return text
      .split(/\n+/)
      .map((line) => line.trim())
      .filter((line) => line.length > 0)
      .map((line) => {
        let bold = false;
        let quote = false;
        let content = line;
        if (/^>\s?/.test(content)) {
          quote = true;
          content = content.replace(/^>\s?/, "");
        }
        if (/^#{1,6}\s*/.test(content)) {
          bold = true;
          content = content.replace(/^#{1,6}\s*/, "");
        }
        content = content.replace(/\*\*(.+?)\*\*/g, "$1");
        content = content.replace(/\*(.+?)\*/g, "$1");
        content = content.replace(/^-{3,}$/, "");
        content = content.replace(/^[-*]\s+/, "• ");
        return { text: content, bold, quote };
      })
      .filter((l) => l.text.length > 0);
  }

  pdfBtn.addEventListener("click", () => {
    if (!history.length) return;
    if (typeof window.jspdf === "undefined") {
      appendErrorNote("Não foi possível gerar o PDF agora. Verifique sua conexão com a internet e tente novamente.");
      return;
    }
    const originalLabel = pdfBtn.textContent;
    pdfBtn.disabled = true;
    pdfBtn.textContent = "⏳ Gerando PDF…";

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });

      // ---- Paleta (as mesmas cores do site) ----
      const ACENTO = [122, 59, 46];
      const ACENTO_ESC = [92, 44, 34];
      const TINTA = [43, 36, 32];
      const TINTA_SUAVE = [107, 95, 82];
      const BORDA = [206, 186, 152];
      const FUNDO_VERSICULO = [240, 232, 214];

      // ---- Geometria da página (A4: 210 x 297 mm) ----
      const LARGURA = doc.internal.pageSize.getWidth();
      const MOLDURA = { x: 12, y: 12, w: LARGURA - 24, h: 273 };
      const LINHA_CABECALHO = 33;   // régua abaixo do cabeçalho
      const LINHA_RODAPE = 272;     // régua acima do rodapé
      const AREA = { topo: 40, base: 266, esq: 21, dir: LARGURA - 21 };
      const LARGURA_TEXTO = AREA.dir - AREA.esq;
      const ALTURA_UTIL = AREA.base - AREA.topo;
      const DATA_HOJE = new Date().toLocaleDateString("pt-BR");

      let y = AREA.topo;

      // ---- Moldura (bordas laterais) + cabeçalho, repetidos em toda página ----
      function desenharMolduraECabecalho() {
        // Moldura dupla: um traço firme e outro fininho por dentro.
        doc.setDrawColor(BORDA[0], BORDA[1], BORDA[2]);
        doc.setLineWidth(0.7);
        doc.roundedRect(MOLDURA.x, MOLDURA.y, MOLDURA.w, MOLDURA.h, 3, 3, "S");
        doc.setLineWidth(0.2);
        doc.roundedRect(MOLDURA.x + 1.6, MOLDURA.y + 1.6, MOLDURA.w - 3.2, MOLDURA.h - 3.2, 2.4, 2.4, "S");

        // Logotipo: círculo cheio com a cruz vazada, igual ao do site.
        doc.setFillColor(ACENTO[0], ACENTO[1], ACENTO[2]);
        doc.circle(25, 22, 4.6, "F");
        doc.setDrawColor(246, 241, 231);
        doc.setLineWidth(1.3);
        doc.line(25, 18.3, 25, 26.2);
        doc.line(22.2, 20.6, 27.8, 20.6);

        doc.setFont("times", "bold");
        doc.setFontSize(11.5);
        doc.setTextColor(ACENTO_ESC[0], ACENTO_ESC[1], ACENTO_ESC[2]);
        doc.text("Aconselhamento Bíblico Cristocêntrico", 33, 21.5);

        doc.setFont("times", "italic");
        doc.setFontSize(8);
        doc.setTextColor(TINTA_SUAVE[0], TINTA_SUAVE[1], TINTA_SUAVE[2]);
        doc.text("Registro de aconselhamento pastoral", 33, 26.5);

        doc.setFont("times", "normal");
        doc.setFontSize(8.5);
        doc.text(DATA_HOJE, AREA.dir, 26.5, { align: "right" });

        doc.setDrawColor(BORDA[0], BORDA[1], BORDA[2]);
        doc.setLineWidth(0.4);
        doc.line(AREA.esq, LINHA_CABECALHO, AREA.dir, LINHA_CABECALHO);
      }

      function novaPagina() {
        doc.addPage();
        desenharMolduraECabecalho();
        y = AREA.topo;
      }

      // ---- Medição: descobre a altura de um bloco ANTES de desenhá-lo ----
      // É isso que permite garantir que nenhum parágrafo seja partido ao meio:
      // se ele não couber inteiro no que resta da folha, começamos outra folha.
      function medirBloco(p) {
        let fonte, estilo, tamanho, entrelinha, recuo, antes, depois;
        if (p.quote) {
          fonte = "times"; estilo = "italic"; tamanho = 10.5;
          entrelinha = 5.4; recuo = 7; antes = 7; depois = 4;
        } else if (p.bold) {
          fonte = "times"; estilo = "bold"; tamanho = 12.5;
          entrelinha = 6.4; recuo = 0; antes = 4.5; depois = 1.8;
        } else {
          fonte = "times"; estilo = "normal"; tamanho = 11;
          entrelinha = 5.8; recuo = 0; antes = 0; depois = 2.4;
        }
        doc.setFont(fonte, estilo);
        doc.setFontSize(tamanho);
        const linhas = doc.splitTextToSize(p.text, LARGURA_TEXTO - recuo * 2);
        const alturaTexto = linhas.length * entrelinha;
        return {
          linhas, fonte, estilo, tamanho, entrelinha, recuo, antes, depois,
          altura: antes + alturaTexto + depois,
          alturaTexto,
        };
      }

      function desenharBloco(p, m) {
        y += m.antes;

        if (p.quote) {
          // Versículo: caixa clara com uma barra de destaque à esquerda.
          // A caixa é calculada a partir da altura VISUAL do texto (topo da
          // primeira letra até a base da última linha), com folga igual em cima
          // e embaixo — senão o texto encosta na borda e fica apertado.
          const topoCaixa = y - 5.1;
          const alturaCaixa = m.alturaTexto - m.entrelinha + 8.4;
          doc.setFillColor(FUNDO_VERSICULO[0], FUNDO_VERSICULO[1], FUNDO_VERSICULO[2]);
          doc.rect(AREA.esq, topoCaixa, LARGURA_TEXTO, alturaCaixa, "F");
          doc.setFillColor(ACENTO[0], ACENTO[1], ACENTO[2]);
          doc.rect(AREA.esq, topoCaixa, 1.4, alturaCaixa, "F");
          doc.setTextColor(ACENTO_ESC[0], ACENTO_ESC[1], ACENTO_ESC[2]);
        } else if (p.bold) {
          doc.setTextColor(ACENTO_ESC[0], ACENTO_ESC[1], ACENTO_ESC[2]);
        } else {
          doc.setTextColor(TINTA[0], TINTA[1], TINTA[2]);
        }

        doc.setFont(m.fonte, m.estilo);
        doc.setFontSize(m.tamanho);
        m.linhas.forEach((linha) => {
          doc.text(linha, AREA.esq + m.recuo, y);
          y += m.entrelinha;
        });
        y += m.depois;
      }

      // Imprime um bloco inteiro, nunca partido — a não ser que ele seja, sozinho,
      // maior que uma página inteira (aí não existe alternativa a não ser dividir).
      function imprimirBloco(p, espacoExtraNecessario) {
        const extra = espacoExtraNecessario || 0;
        const m = medirBloco(p);
        if (m.altura > ALTURA_UTIL) {
          m.linhas.forEach((linha) => {
            if (y + m.entrelinha > AREA.base) novaPagina();
            doc.setFont(m.fonte, m.estilo);
            doc.setFontSize(m.tamanho);
            doc.setTextColor(TINTA[0], TINTA[1], TINTA[2]);
            doc.text(linha, AREA.esq + m.recuo, y);
            y += m.entrelinha;
          });
          y += m.depois;
          return;
        }
        if (y + m.altura + extra > AREA.base) novaPagina();
        desenharBloco(p, m);
      }

      // ---- Conteúdo da conversa ----
      desenharMolduraECabecalho();

      const conversa = buildExportableHistory();
      conversa.forEach((msg, indice) => {
        const blocos = stripMarkdownForPdf(msg.text);
        if (!blocos.length) return;
        const rotulo = msg.role === "assistant" ? "CONSELHEIRO BÍBLICO" : "VOCÊ";

        // O rótulo nunca fica órfão no pé da página: ele só é desenhado se o
        // primeiro parágrafo da fala couber logo abaixo dele, na mesma folha.
        const alturaRotulo = indice === 0 ? 6.5 : 10;
        const primeiro = medirBloco(blocos[0]);
        let precisaJunto = Math.min(primeiro.altura, ALTURA_UTIL);
        // Se a fala começa com um título, o rótulo precisa caber junto com o
        // título E com o parágrafo dele — senão o rótulo é que ficaria órfão.
        if (blocos[0].bold && blocos[1]) {
          const seg = medirBloco(blocos[1]);
          if (alturaRotulo + primeiro.altura + seg.altura <= ALTURA_UTIL) {
            precisaJunto = primeiro.altura + seg.altura;
          }
        }
        if (y + alturaRotulo + precisaJunto > AREA.base) novaPagina();

        if (indice > 0) {
          doc.setDrawColor(BORDA[0], BORDA[1], BORDA[2]);
          doc.setLineWidth(0.2);
          doc.line(AREA.esq, y - 0.5, AREA.dir, y - 0.5);
          y += 4;
        }

        doc.setFont("times", "bold");
        doc.setFontSize(8.5);
        doc.setTextColor(ACENTO[0], ACENTO[1], ACENTO[2]);
        doc.text(rotulo, AREA.esq, y);
        y += 6.5;

        for (let i = 0; i < blocos.length; i++) {
          const bloco = blocos[i];
          let extra = 0;
          // Um título de seção nunca fica sozinho no pé da página: só é impresso
          // aqui se couberem, junto com ele, as duas primeiras linhas do parágrafo
          // que vem logo abaixo. Caso contrário, título e texto vão juntos para a
          // folha seguinte.
          const proximo = blocos[i + 1];
          if (bloco.bold && proximo) {
            const seg = medirBloco(proximo);
            const m = medirBloco(bloco);
            // Reserva a altura INTEIRA do parágrafo seguinte, e não apenas as
            // primeiras linhas: como nenhum parágrafo pode ser partido, reservar
            // só um pedaço faria o texto pular de página assim mesmo, deixando o
            // título sozinho no pé da folha.
            const cheio = seg.altura;
            if (m.altura + cheio <= ALTURA_UTIL) extra = cheio;
            else extra = seg.antes + seg.entrelinha * 2;
          }
          imprimirBloco(bloco, extra);
        }
        y += 3;
      });

      // ---- Caixa de alerta (nunca partida entre páginas) ----
      doc.setFont("times", "normal");
      doc.setFontSize(9.5);
      const alertaLinhas = doc.splitTextToSize(
        "Atenção: " + CRISIS_ALERT_TEXT,
        LARGURA_TEXTO - 10
      );
      const alturaAlerta = alertaLinhas.length * 5 + 9;
      if (y + alturaAlerta + 4 > AREA.base) novaPagina();
      y += 4;
      doc.setFillColor(251, 238, 238);
      doc.setDrawColor(226, 178, 178);
      doc.setLineWidth(0.4);
      doc.roundedRect(AREA.esq, y, LARGURA_TEXTO, alturaAlerta, 2, 2, "FD");
      doc.setTextColor(122, 46, 46);
      let ya = y + 6.5;
      alertaLinhas.forEach((linha) => {
        doc.text(linha, AREA.esq + 5, ya);
        ya += 5;
      });

      // ---- Rodapé em TODAS as páginas, com a numeração ----
      // Feito no fim, quando já sabemos quantas páginas o documento tem.
      const total = doc.internal.getNumberOfPages();
      for (let i = 1; i <= total; i++) {
        doc.setPage(i);
        doc.setDrawColor(BORDA[0], BORDA[1], BORDA[2]);
        doc.setLineWidth(0.4);
        doc.line(AREA.esq, LINHA_RODAPE, AREA.dir, LINHA_RODAPE);

        doc.setFont("times", "normal");
        doc.setFontSize(8);
        doc.setTextColor(TINTA_SUAVE[0], TINTA_SUAVE[1], TINTA_SUAVE[2]);
        doc.text(FOOTER_TEXT, AREA.esq, LINHA_RODAPE + 5.5);
        doc.text("Página " + i + " de " + total, AREA.dir, LINHA_RODAPE + 5.5, { align: "right" });
      }

      const filename = "aconselhamento-biblico-" + new Date().toISOString().slice(0, 10) + ".pdf";
      doc.save(filename);
    } catch (e) {
      appendErrorNote("Não foi possível gerar o PDF agora. Tente novamente.");
    } finally {
      pdfBtn.disabled = false;
      pdfBtn.textContent = originalLabel;
    }
  });

  restartBtn.addEventListener("click", restartConversation);
  sendBtn.addEventListener("click", () => sendMessage());
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  renderWelcome();
  updateExportButtonsState();
</script>

</body>
</html>
